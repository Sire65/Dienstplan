<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KC DP2 – Passwort ändern</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:20px;background:#f6f7f8;color:#111}
    .box{background:#fff;border:1px solid #ddd;border-radius:14px;padding:24px}
    h1{font-size:22px;margin-top:0}
    label{display:block;margin-top:16px;font-weight:600}
    input{box-sizing:border-box;width:100%;font-size:18px;padding:12px;margin-top:6px;border:1px solid #999;border-radius:9px}
    button,a.btn{display:block;box-sizing:border-box;width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#111;color:#fff;text-align:center;text-decoration:none;font-size:17px}
    button:disabled{opacity:.55}
    .note{font-size:14px;color:#555;margin-top:14px}
    .ok{color:#087a2f;font-weight:700}
    .err{color:#a00;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>KC DP2 – neues Passwort</h1>
    <p>Lege hier dein neues Passwort für <b>ha-joko@web.de</b> fest.</p>
    <form id="form">
      <label>Neues Passwort
        <input id="password" type="password" minlength="12" autocomplete="new-password" required>
      </label>
      <label>Passwort wiederholen
        <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
      </label>
      <button id="save" type="submit">Passwort speichern</button>
    </form>
    <p id="status" class="note">Mindestens 12 Zeichen. Das Passwort wird direkt verschlüsselt an Supabase übertragen und nicht in GitHub gespeichert.</p>
    <a id="open" class="btn" href="https://sire65.github.io/Dienstplan/" hidden>Dienstplan öffnen</a>
  </div>
<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('t') || '';
  history.replaceState(null, '', location.pathname);
  const form = document.getElementById('form');
  const save = document.getElementById('save');
  const status = document.getElementById('status');
  const open = document.getElementById('open');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (!token) { status.className='err'; status.textContent='Sicherheitscode fehlt. Bitte den vollständigen Link aus dem Chat öffnen.'; return; }
    if (password.length < 12) { status.className='err'; status.textContent='Bitte mindestens 12 Zeichen verwenden.'; return; }
    if (password !== confirm) { status.className='err'; status.textContent='Die beiden Passwörter stimmen nicht überein.'; return; }
    save.disabled = true;
    status.className='note'; status.textContent='Passwort wird gespeichert …';
    try {
      const r = await fetch('https://ptblnpiroqftcvlsrhac.supabase.co/functions/v1/kc-dp-password-reset-temp', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({token, password})
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || 'reset_failed');
      status.className='ok'; status.textContent='✓ Passwort gespeichert. Du kannst jetzt den Dienstplan öffnen.';
      form.hidden = true;
      open.hidden = false;
    } catch (err) {
      status.className='err';
      status.textContent='Passwort konnte nicht gespeichert werden. Bitte hier im Chat kurz „Fehler“ schreiben.';
      save.disabled = false;
    }
  });
})();
</script>
</body>
</html>
