<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#741521">
  <title>KC DP2 wird repariert</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eee9e5;color:#292524;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(620px,100%);background:#fff;border:1px solid #d8ccc5;border-radius:20px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 50px #0002}
    h1{margin:0 0 12px;color:#741521;font-size:clamp(1.55rem,5vw,2.15rem)}p{margin:8px 0 18px}.bar{height:12px;border-radius:999px;background:#eadfe0;overflow:hidden}.bar i{display:block;width:15%;height:100%;background:#8f1422;border-radius:inherit;animation:work 1.25s ease-in-out infinite alternate}
    @keyframes work{to{width:100%}}#state{margin-top:18px;padding:14px;border-radius:12px;background:#f7f4f1;font-weight:700}button{display:none;width:100%;min-height:50px;margin-top:18px;border:0;border-radius:12px;background:#8f1422;color:#fff;font:700 1rem system-ui;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>KC DP2 wird automatisch repariert</h1>
  <p>Alte Programmdateien werden entfernt und frisch geladen. Deine Dienstplan-Daten in IndexedDB bleiben erhalten.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div id="state" role="status" aria-live="polite">Reparatur wird vorbereitet …</div>
  <button id="again" type="button">DP2 jetzt neu öffnen</button>
</main>
<script>
(async function(){
  const state=document.getElementById('state'),again=document.getElementById('again');
  const open=()=>location.replace('./?kc_repaired='+Date.now());
  again.onclick=open;
  try{
    state.textContent='Alten Service Worker entfernen …';
    if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/Dienstplan/')).map(r=>r.unregister()))}
    state.textContent='Alte Programm-Caches entfernen …';
    if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>/^kc-dp-release-|^kc-dp-release-meta|^kc-dp-update/i.test(n)).map(n=>caches.delete(n)))}
    try{for(const key of Object.keys(localStorage))if(/^kc_dp_(?:staged_release|pending_update|snooze|build)/i.test(key))localStorage.removeItem(key)}catch(_){}
    state.textContent='Reparatur abgeschlossen. DP2 wird frisch geöffnet …';
    setTimeout(open,500);
  }catch(e){
    state.textContent='Die automatische Reparatur ist vorbereitet. Bitte DP2 jetzt neu öffnen.';
    again.style.display='block';
  }
})();
</script>
</body>
</html>
