name: KC DP2 V0.19.42 One-off Release Hygiene Fix

on:
  push:
    branches: [feature/pc-manager-leading-source-v01942]
    paths:
      - '.github/workflows/v01942-oneoff-dedicated-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch-release-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pc-manager-leading-source-v01942
      - name: Set V0.19.42 browser title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/v0.19.41/site/index.html')
          s=p.read_text(encoding='utf-8')
          old='<title>KC DP V0.17.10</title>'
          new='<title>KC DP2 V0.19.42</title>'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one legacy title, found {s.count(old)}')
          s=s.replace(old,new,1)
          if old in s or new not in s:
              raise SystemExit('title replacement verification failed')
          p.write_text(s,encoding='utf-8')
          print('KC DP2 V0.19.42 browser title PASS')
          PY
      - name: Commit release hygiene fix
        run: |
          if git diff --quiet -- release/v0.19.41/site/index.html; then
            echo 'No index.html change produced; refusing silent no-op.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v0.19.41/site/index.html
          git commit -m 'fix: align V0.19.42 browser title with release line'
          git push origin HEAD:feature/pc-manager-leading-source-v01942
