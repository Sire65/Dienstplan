name: KC DP2 V0.20.0 Recovery Gate

on:
  push:
    branches:
      - recovery/dp2-v02000
  pull_request:
    branches:
      - recovery/dp2-v02000
  workflow_dispatch:

jobs:
  recovery-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Baseline gate
        run: node tests/v02000-baseline-gate.js
      - name: Local XLSX parser gate
        run: node tests/v02000-xlsx-local-gate.js
      - name: Mobile day smoke gate
        run: node tests/v02000-mobile-day-smoke.js
      - name: V H B behavior gate
        run: node tests/v02000-vhb-behavior-gate.js
      - name: Planner interactions gate
        run: node tests/v02000-planner-interactions-gate.js
      - name: Publication and actual workflow gate
        run: node tests/v02000-publication-actual-gate.js
      - name: Start choice gate
        run: node tests/v02000-start-choice-gate.js
      - name: Device key management gate
        run: node tests/v02000-device-key-gate.js
      - name: Mobile login input gate
        run: node tests/v02000-mobile-login-input-gate.js
      - name: KC Communication bridge isolation gate
        run: node tests/v02000-communication-bridge-gate.js
      - name: KC Communication status gate
        run: node tests/v02000-communication-status-gate.js
      - name: Supabase timeout behavior gate
        run: node tests/v02000-supabase-timeout-gate.js
      - name: V0.20.0 RC freeze gate
        run: node tests/v02000-release-candidate-freeze-gate.js
      - name: Syntax check stable release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="release/v0.19.54/site"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$ROOT" -type f -name '*.js' -print0)
      - name: Recovery architecture guard
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/KC-DP2-V02000-RECOVERY.md
          grep -q "Sire65/KC-Communication" docs/KC-DP2-V02000-RECOVERY.md
          grep -q "DP2 muss ohne Kommunikationsmodul starten" docs/KC-DP2-V02000-RECOVERY.md
