name: KC DP2 Emergency Pages Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'release/current.json'
      - 'release/v*/site/**'
      - '.github/workflows/deploy-kc-dp2-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve current release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release/current.json').version")"
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          BUILD="$(node -p "require('./release/current.json').build")"
          test "$RELEASE_PATH" = "release/v${VERSION}/site"
          test -f "$RELEASE_PATH/index.html"
          test -f "$RELEASE_PATH/src/ui/owner-emergency-access.js"
          grep -q "owner-recovery-10" "$RELEASE_PATH/src/ui/owner-emergency-access.js"
          test "$BUILD" -ge 84
          echo "path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp -a "${{ steps.release.outputs.path }}/." dist/
          sed -i 's/window.KC_DP_BUILD=83/window.KC_DP_BUILD=84/g' dist/index.html
          sed -i 's/update-build-guard.js?build=83/update-build-guard.js?build=84/g' dist/index.html
          sed -i 's/session-mobile-hotfix.js?build=83/session-mobile-hotfix.js?build=84/g' dist/index.html
          sed -i 's/post-unlock-auth-guard.js?build=83/post-unlock-auth-guard.js?build=84/g' dist/index.html
          sed -i -E 's#owner-emergency-access\.js\?build=[^"< ]+#owner-emergency-access.js?build=84-owner-recovery-10#g' dist/index.html
          sed -i -E 's#excel-paper-tools\.js\?build=[^"< ]+#excel-paper-tools.js?build=87-original-excel-qr3#g' dist/index.html
          sed -i -E 's#wish-sprint\.js\?v=[^"< ]+#wish-sprint.js?v=0.19.51-excel3#g' dist/index.html
          grep -q 'owner-emergency-access.js?build=84-owner-recovery-10' dist/index.html
          grep -q 'owner-recovery-10' dist/src/ui/owner-emergency-access.js
          grep -q 'excel-paper-tools.js?build=87-original-excel-qr3' dist/index.html
          grep -q 'wish-sprint.js?v=0.19.51-excel3' dist/index.html
          grep -q '0.19.55-original-excel-qr-3' dist/src/ui/excel-paper-tools.js
          test -s dist/vendor/jszip.min.js
          grep -q 'matrix-photo-ocr.js?v=0.19.55-ocr2' dist/index.html
          grep -q '0.19.55-matrix-photo-ocr-2' dist/src/adapters/matrix-photo-ocr.js
          test -s dist/vendor/jsQR.js
          test -s dist/vendor/tesseract/tesseract.min.js
          test -s dist/vendor/tesseract/worker.min.js
          test -s dist/vendor/tesseract/tesseract-core-simd-lstm.wasm.js
          test -s dist/vendor/tesseract/lang-data/eng.traineddata.gz
          grep -q 'wish-import.js?v=0.19.55-excel-import-2' dist/index.html
          grep -q 'role-ux.js?v=0.19.55-excel-import-1' dist/index.html
          grep -q 'KC-local-1.2-empty-cell-safe' dist/src/adapters/xlsx-local.js
          grep -q 'enthält aber noch keine ausgefüllten Zeiten' dist/src/ui/role-ux.js
          grep -q 'window.KC_DP_BUILD=84' dist/index.html
          printf '%s\n' 'KC DP2 emergency hotfix deployment build 84 owner-recovery-10 clean-restart' > dist/HOTFIX_BUILD.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
