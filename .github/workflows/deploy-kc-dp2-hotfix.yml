name: KC DP2 Emergency Pages Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'release/current.json'
      - 'release/v*/site/**'
      - '.github/workflows/deploy-kc-dp2-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve current release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release/current.json').version")"
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          BUILD="$(node -p "require('./release/current.json').build")"
          test "$RELEASE_PATH" = "release/v${VERSION}/site"
          test -f "$RELEASE_PATH/index.html"
          test -f "$RELEASE_PATH/src/ui/owner-emergency-access.js"
          grep -q "owner-recovery-7" "$RELEASE_PATH/src/ui/owner-emergency-access.js"
          test "$BUILD" -ge 84
          echo "path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp -a "${{ steps.release.outputs.path }}/." dist/
          sed -i 's/window.KC_DP_BUILD=83/window.KC_DP_BUILD=84/g' dist/index.html
          sed -i 's/update-build-guard.js?build=83/update-build-guard.js?build=84/g' dist/index.html
          sed -i 's/session-mobile-hotfix.js?build=83/session-mobile-hotfix.js?build=84/g' dist/index.html
          sed -i 's/post-unlock-auth-guard.js?build=83/post-unlock-auth-guard.js?build=84/g' dist/index.html
          sed -i -E 's#owner-emergency-access\.js\?build=[^"< ]+#owner-emergency-access.js?build=84-owner-recovery-7#g' dist/index.html
          sed -i 's/excel-paper-tools.js?build=83/excel-paper-tools.js?build=84/g' dist/index.html
          grep -q 'owner-emergency-access.js?build=84-owner-recovery-7' dist/index.html
          grep -q 'owner-recovery-7' dist/src/ui/owner-emergency-access.js
          grep -q 'window.KC_DP_BUILD=84' dist/index.html
          printf '%s\n' 'KC DP2 emergency hotfix deployment build 84 owner-recovery-7 tablet-layout' > dist/HOTFIX_BUILD.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
