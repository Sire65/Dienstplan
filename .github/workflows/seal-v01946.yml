name: KC DP2 V0.19.46 Seal

on:
  push:
    branches: [chore/deep-consolidation-v01945]
    paths:
      - '.github/workflows/seal-v01946.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/deep-consolidation-v01945
          fetch-depth: 0
      - name: Seal V0.19.46 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          site=Path('release/v0.19.46/site'); mp=site/'update-manifest.json'; m=json.loads(mp.read_text(encoding='utf-8'))
          if m.get('version')!='0.19.46': raise SystemExit('wrong manifest version')
          total=0
          for f in m['files']:
              install=f.get('installPath') or f['path']; p=site/install
              if not p.exists(): raise SystemExit(f'missing {install}')
              b=p.read_bytes(); f['bytes']=len(b); f['sha256']=hashlib.sha256(b).hexdigest()
              if f.get('runtime',True): total+=len(b)
          m['cacheName']='kc-dp-release-0.19.46'; m['totalRuntimeBytes']=total; m['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SEALED',len(m['files']),total)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v0.19.46/site/update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: seal KC DP2 V0.19.46 manifest'
            git push origin HEAD:chore/deep-consolidation-v01945
          fi
