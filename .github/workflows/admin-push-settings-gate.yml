name: KC DP2 Admin Push Settings Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-push-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check release/v0.19.51/site/src/adapters/admin-push-settings.js
          node --check release/v0.19.51/site/src/ui/admin-push-settings.js
          node --check release/v0.19.51/site/src/core/planner-application-guard.js
      - name: Contract
        run: node tests/admin-push-settings-gate.js
