name: KC DP2 V0.19.47 Pilot Gate
on:
  push:
    branches: [feature/pilot-onboarding-v01947]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pilot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pilot syntax and security contract
        run: |
          node --check tests/pilot-v01947-gate.js
          node --check release/v0.19.46/site/src/core/pilot-onboarding.js
          node --check release/v0.19.46/site/src/ui/pilot-app.js
          node --check release/v0.19.46/site/pilot-sw.js
          node tests/pilot-v01947-gate.js
