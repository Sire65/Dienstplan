name: V0.19.43 Manifest Probe
on:
  push:
    branches: [feature/error-diagnostics-v01944]
    paths: ['.github/workflows/v01943-manifest-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Exact runtime values
        run: |
          set -euo pipefail
          for f in \
            release/v0.19.42/site/src/ui/source-health-ui.js \
            release/v0.19.42/site/src/ui/push-center.js \
            release/v0.19.42/site/src/ui/push-center.css; do
            echo "PROBE $f bytes=$(wc -c < "$f" | tr -d ' ') sha256=$(sha256sum "$f" | awk '{print $1}')"
          done
