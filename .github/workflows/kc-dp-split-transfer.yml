name: KC-DP2 Supabase Split Transfer

on:
  push:
    branches: [kc-dp2-supabase-split-v01914]
    paths: [.github/workflows/kc-dp-split-transfer.yml]

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer encrypted KC-DP state Supabase-to-Supabase
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 120 \
            -X POST \
            https://iddudrxuihdodnvejxcp.supabase.co/functions/v1/kc-dp-export-v01914 \
            -o /tmp/kcdp-transfer.json
          cat /tmp/kcdp-transfer.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/kcdp-transfer.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('exportedOperations') == 46, d
          assert d.get('exportedVersions') == 26, d
          t=d.get('target') or {}
          assert t.get('ok') is True, d
          assert t.get('sync_ops') == 46, d
          assert int(t.get('max_seq',0)) == 48, d
          assert t.get('entity_versions') == 26, d
          assert int(t.get('admins',0)) >= 1, d
          print('KC-DP encrypted transfer verified:', {'operations':46,'max_seq':48,'versions':26,'admins':t.get('admins')})
          PY
