name: KC DP2 V0.19.50 Mobile Colleague Search Package
on:
  push:
    branches: [fix/mobile-kollegen-suchen-v01950]
    paths: ['.github/workflows/package-v01950.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mobile-kollegen-suchen-v01950
          fetch-depth: 0
      - name: Create canonical V0.19.50 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v0.19.50
          cp -a release/v0.19.49 release/v0.19.50
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          root=Path('release/v0.19.50/site')
          def repl(rel,a,b):
              p=root/rel;s=p.read_text(encoding='utf-8')
              if a not in s: raise SystemExit(f'marker missing {rel}: {a}')
              p.write_text(s.replace(a,b),encoding='utf-8')
          repl('index.html','KC DP2 V0.19.49','KC DP2 V0.19.50')
          repl('index.html',"EXPECTED='0.19.49'","EXPECTED='0.19.50'")
          repl('src/core/model.js',"K.VERSION='0.19.49'","K.VERSION='0.19.50'")
          repl('src/core/update-manager.js',"CURRENT_RELEASE='0.19.49'","CURRENT_RELEASE='0.19.50'")
          repl('src/core/update-manager.js',"version:'0.19.49'","version:'0.19.50'")
          repl('src/adapters/push.js','service-worker.js?v=0.19.49','service-worker.js?v=0.19.50')
          repl('src/adapters/push.js',"version:'0.19.49'","version:'0.19.50'")
          repl('src/ui/kc-ux-polish.js','0.19.49','0.19.50')
          repl('src/ui/source-health-ui.js',"K.sourceHealthUi={version:'0.19.49'","K.sourceHealthUi={version:'0.19.50'")
          repl('src/ui/source-health-ui.js','kc-ux-polish.css?v=0.19.49','kc-ux-polish.css?v=0.19.50')
          repl('src/ui/source-health-ui.js','kc-ux-polish.js?v=0.19.49','kc-ux-polish.js?v=0.19.50')

          mobile = r'''(function(){
  const K=window.KCDP=window.KCDP||{};
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const phone=v=>String(v||'').trim();
  function people(){
    const self=K.currentUser?.personId;
    return (K.people||[]).filter(p=>p&&p.active!==false&&p.personId!==self).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
  }
  function open(){
    let back=document.getElementById('kcMobileColleagueBackdrop');
    if(!back){
      back=document.createElement('div');back.id='kcMobileColleagueBackdrop';back.className='kc-mobile-colleague-backdrop';
      back.innerHTML='<section class="kc-mobile-colleague-panel" role="dialog" aria-modal="true" aria-label="Kollegen suchen"><header><div><h2>👥 Kollegen suchen</h2><p>Name oder Qualifikation eingeben.</p></div><button type="button" id="kcMobileColleagueClose" aria-label="Schließen">×</button></header><input id="kcMobileColleagueInput" type="search" inputmode="search" autocomplete="off" placeholder="Kollege suchen …"><div id="kcMobileColleagueList" class="kc-mobile-colleague-list"></div></section>';
      document.body.appendChild(back);
      back.addEventListener('pointerdown',e=>{if(e.target===back)close()});
      back.querySelector('#kcMobileColleagueClose').onclick=close;
      back.querySelector('#kcMobileColleagueInput').addEventListener('input',render);
    }
    back.classList.add('open');render();setTimeout(()=>back.querySelector('#kcMobileColleagueInput')?.focus(),50);
  }
  function close(){document.getElementById('kcMobileColleagueBackdrop')?.classList.remove('open')}
  function render(){
    const host=document.getElementById('kcMobileColleagueList'),input=document.getElementById('kcMobileColleagueInput');if(!host)return;
    const q=String(input?.value||'').trim().toLocaleLowerCase('de');
    const rows=people().filter(p=>!q||`${p.name||''} ${p.firstName||''} ${p.skills||''} ${p.personId||''}`.toLocaleLowerCase('de').includes(q));
    host.innerHTML=rows.map(p=>{const tel=phone(p.phone);return `<article class="kc-mobile-colleague-row"><div><b>${esc(p.name||p.firstName||'Kollege')}</b><span>${esc(p.skills||'Köcheclub')}</span></div>${tel?`<a class="kc-mobile-call" href="tel:${esc(tel.replace(/[^+0-9]/g,''))}" aria-label="${esc(p.name||'Kollege')} anrufen">☎ Anrufen</a>`:'<small>Keine Telefonnummer hinterlegt</small>'}</article>`}).join('')||'<div class="kc-mobile-colleague-empty">Kein passender Kollege gefunden.</div>';
  }
  function inject(){
    const host=document.querySelector('#mainView .mobile-personal');if(!host)return;
    let b=host.querySelector('#mobileColleagueSearchBtn');
    if(!b){b=document.createElement('button');b.type='button';b.id='mobileColleagueSearchBtn';b.className='primary kc-mobile-colleague-trigger';b.textContent='👥 Kollegen suchen';host.appendChild(b)}
    b.onclick=open;
  }
  const mo=new MutationObserver(inject);
  function start(){const main=document.getElementById('mainView');if(!main)return setTimeout(start,100);mo.observe(main,{childList:true,subtree:true});inject()}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  K.mobileColleagueSearch={version:'0.19.50',open,close,refresh:inject};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
'''
          (root/'src/ui/mobile-colleague-search.js').write_text(mobile,encoding='utf-8')
          css = r'''
@media (max-width:600px){
  .kc-mobile-colleague-trigger{width:100%;min-height:48px;margin:18px 0 8px;font-size:1rem}
  .kc-mobile-colleague-backdrop{position:fixed;inset:0;z-index:130000;display:none;align-items:flex-end;background:rgba(25,20,18,.52);padding:0}
  .kc-mobile-colleague-backdrop.open{display:flex}
  .kc-mobile-colleague-panel{width:100%;max-height:88dvh;overflow:auto;background:#fffaf3;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px #0004}
  .kc-mobile-colleague-panel header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .kc-mobile-colleague-panel h2{margin:0;color:#6f1728;font-size:1.3rem}.kc-mobile-colleague-panel p{margin:4px 0 0;color:#655b53}
  #kcMobileColleagueClose{border:0;background:#eee3d7;border-radius:999px;width:42px;height:42px;font-size:1.65rem}
  #kcMobileColleagueInput{width:100%;min-height:48px;border:1px solid #cdbda8;border-radius:12px;padding:0 14px;font-size:16px;background:#fff;margin-bottom:12px}
  .kc-mobile-colleague-list{display:grid;gap:8px}.kc-mobile-colleague-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e3d6c5;border-radius:13px;background:#fff}
  .kc-mobile-colleague-row div{min-width:0;display:grid;gap:3px}.kc-mobile-colleague-row b{overflow-wrap:anywhere}.kc-mobile-colleague-row span,.kc-mobile-colleague-row small{color:#685f57;font-size:.88rem}
  .kc-mobile-call{flex:0 0 auto;text-decoration:none;background:#741521;color:white;border-radius:10px;padding:10px 12px;font-weight:700}.kc-mobile-colleague-empty{padding:20px;text-align:center;color:#685f57}
}
'''
          with (root/'src/ui/app.css').open('a',encoding='utf-8') as f:f.write(css)
          repl('index.html','  <script src="src/ui/app.js?v=0.19.37"></script>','  <script src="src/ui/app.js?v=0.19.37"></script>\n  <script src="src/ui/mobile-colleague-search.js?v=0.19.50"></script>')

          mp=root/'update-manifest.json';m=json.loads(mp.read_text(encoding='utf-8'))
          m['version']='0.19.50';m['cacheName']='kc-dp-release-0.19.50';m['releaseNotes']=[
            'Handyfunktion Kollegen suchen repariert und fest verdrahtet',
            'Mobile Kollegensuche nach Name und Qualifikation',
            'Direkter Anruf nur bei hinterlegter Telefonnummer',
            'Kollegensuche bleibt read-only und verändert keine Dienstplandaten'
          ];m['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          if not any((f.get('installPath') or f.get('path'))=='src/ui/mobile-colleague-search.js' for f in m['files']):
              m['files'].append({'path':'src/ui/mobile-colleague-search.js','installPath':'src/ui/mobile-colleague-search.js','bytes':0,'sha256':'','runtime':True})
          total=0;seen=set()
          for f in m['files']:
              install=f.get('installPath') or f['path']
              if install in seen: raise SystemExit('duplicate manifest path '+install)
              seen.add(install);p=root/install
              if not p.is_file(): raise SystemExit('manifest file missing '+install)
              b=p.read_bytes();f['bytes']=len(b);f['sha256']=hashlib.sha256(b).hexdigest()
              if f.get('runtime',True): total+=len(b)
          m['totalRuntimeBytes']=total;mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('release/current.json').write_text(json.dumps({'app':'KC DP2','version':'0.19.50','mode':'verified-direct-site','baseVersion':'0.19.49','previousVersion':'0.19.49','releasePath':'release/v0.19.50/site'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('release/v0.19.50/RELEASE.txt').write_text('KC DP2 V0.19.50\n================\n\nMobile Fix: Kollegen suchen funktioniert in der persönlichen Handyansicht wieder zuverlässig.\n',encoding='utf-8')
          print('SEALED V0.19.50',len(m['files']),'files',total,'runtime bytes')
          PY
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find release/v0.19.50/site -type f -name '*.js' -print0)
          node tests/tuev-studio-current.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v0.19.50 release/current.json
          git commit -m 'release: create KC DP2 V0.19.50 mobile colleague search fix'
          git fetch origin fix/mobile-kollegen-suchen-v01950
          git rebase origin/fix/mobile-kollegen-suchen-v01950
          git push origin HEAD:fix/mobile-kollegen-suchen-v01950
