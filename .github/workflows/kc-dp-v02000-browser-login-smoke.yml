name: KC DP2 V0.20.0 Browser Login Smoke

on:
  pull_request:
    branches:
      - recovery/dp2-v02000
  workflow_dispatch:

jobs:
  browser-login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start recovery site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory release/v0.19.54/site > /tmp/kcdp-http.log 2>&1 &
          echo $! > /tmp/kcdp-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kcdp-http.log
          exit 1
      - name: Android browser login smoke
        id: login_smoke
        continue-on-error: true
        run: node tests/v02000-browser-login-smoke.js
      - name: Android raw functional E2E audit
        id: raw_audit
        continue-on-error: true
        if: always()
        run: node tests/v02000-browser-functional-audit.js
      - name: Android downstream audit with test-only loop neutralization
        id: downstream_audit
        continue-on-error: true
        if: always()
        run: node tests/v02000-browser-downstream-audit.js
      - name: Enforce audit results
        if: always()
        shell: bash
        run: |
          echo "login_smoke=${{ steps.login_smoke.outcome }}"
          echo "raw_audit=${{ steps.raw_audit.outcome }}"
          echo "downstream_audit=${{ steps.downstream_audit.outcome }}"
          if [ "${{ steps.login_smoke.outcome }}" != "success" ] || [ "${{ steps.raw_audit.outcome }}" != "success" ] || [ "${{ steps.downstream_audit.outcome }}" != "success" ]; then
            exit 1
          fi
