name: KC DP2 V0.19.42 Manager Leading Source

on:
  workflow_dispatch:
  push:
    branches: [feature/pc-manager-leading-source-v01942]
    paths:
      - 'release/v0.19.41/site/index.html'
      - 'release/v0.19.41/site/src/adapters/person-provider.js'
      - 'release/v0.19.41/site/src/adapters/pc-manager.js'
      - 'release/v0.19.41/site/src/core/planner-engine.js'
      - 'release/v0.19.41/site/src/core/planner-application-guard.js'
      - 'tests/manager-leading-source-e2e.js'
      - 'tests/planner-engine-v01942-e2e.js'
      - 'tests/planner-runtime-wiring-v01942-e2e.js'
      - 'tests/planner-application-guard-v01942-e2e.js'
      - '.github/workflows/manager-leading-source-v01942.yml'

permissions:
  contents: read

jobs:
  manager-leading-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check V0.19.42 delta
        run: |
          node --check release/v0.19.41/site/src/adapters/person-provider.js
          node --check release/v0.19.41/site/src/adapters/pc-manager.js
          node --check release/v0.19.41/site/src/core/planner-engine.js
          node --check release/v0.19.41/site/src/core/planner-application-guard.js
          node --check tests/manager-leading-source-e2e.js
          node --check tests/planner-engine-v01942-e2e.js
          node --check tests/planner-runtime-wiring-v01942-e2e.js
          node --check tests/planner-application-guard-v01942-e2e.js
      - name: Prepare Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "KC_PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start V0.19.41 baseline with V0.19.42 branch delta
        run: |
          cd release/v0.19.41/site
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kcdp-v01942-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kcdp-v01942-http.log
          exit 1
      - name: Run manager leading-source safety acceptance
        run: node tests/manager-leading-source-e2e.js
      - name: Run rule-bound planner acceptance
        run: node tests/planner-engine-v01942-e2e.js
      - name: Run planner runtime wiring acceptance
        run: node tests/planner-runtime-wiring-v01942-e2e.js
      - name: Run planner application guard acceptance
        run: node tests/planner-application-guard-v01942-e2e.js
      - name: Regression – smartphone
        run: node tests/mobile-smoke.js
      - name: Regression – Wunsch to Soll to Ist
        run: node tests/workflow-e2e.js
      - name: Regression – roles and permissions
        run: node tests/roles-e2e.js
      - name: Regression – documents PDF email
        run: node tests/documents-e2e.js
      - name: Regression – photo pipeline
        run: node tests/photo-pipeline-e2e.js
