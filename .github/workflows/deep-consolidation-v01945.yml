name: KC DP2 V0.19.45 Deep Consolidation TÜV

on:
  push:
    branches: [chore/deep-consolidation-v01945]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kc-dp2-deep-consolidation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  deep-tuev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve canonical current release
        id: release
        shell: bash
        run: |
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          VERSION="$(node -p "require('./release/current.json').version")"
          test "$VERSION" = "0.19.45"
          test -f "$RELEASE_PATH/index.html"
          echo "path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deep TÜV for KC DP2 V$VERSION at $RELEASE_PATH"

      - name: Syntax – complete current browser runtime and all tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.release.outputs.path }}"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$ROOT" -type f -name '*.js' -print0)
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find tests -maxdepth 1 -type f -name '*.js' -print0)

      - name: TÜV Studio – current release, security, architecture, rules
        run: node tests/tuev-studio-current.js
      - name: Release integrity V0.19.45
        run: node tests/release-v01945-gate.js
      - name: KC UX Polish and responsive contract
        run: node tests/ux-polish-v01945-gate.js
      - name: Diagnostics and TableCore contract
        run: node tests/diagnostics-v01944-gate.js
      - name: Push Center contract
        run: node tests/push-center-v01943-gate.js
      - name: Legacy sealed release regression gates
        shell: bash
        run: |
          node tests/local-xlsx-v01942-e2e.js
          node tests/push-receipt-v01942-e2e.js
          node tests/tuev-studio-v01942.js

      - name: Prepare Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "KC_PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start canonical current release
        shell: bash
        run: |
          cd "${{ steps.release.outputs.path }}"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kcdp-deep-http.log 2>&1 &
          echo $! > /tmp/kcdp-deep-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kcdp-deep-http.log
          exit 1

      - name: Dedicated Supabase contract
        run: timeout --signal=TERM 120s node tests/dedicated-supabase-e2e.js
      - name: Manager Core leading-source and completeness
        run: timeout --signal=TERM 120s node tests/manager-leading-source-e2e.js
      - name: Manager auto-sync permissions and failure safety
        run: timeout --signal=TERM 120s node tests/manager-auto-sync-v01942-e2e.js
      - name: Planner central rule engine
        run: timeout --signal=TERM 120s node tests/planner-engine-v01942-e2e.js
      - name: Planner recommendations
        run: timeout --signal=TERM 120s node tests/planner-recommendations-v01942-e2e.js
      - name: Replacement and gap recommendations
        run: timeout --signal=TERM 120s node tests/replacement-recommendations-v01942-e2e.js
      - name: Day availability and day switching
        run: timeout --signal=TERM 120s node tests/day-availability-filter-v01942-e2e.js
      - name: Quick Plan recommendation UI
        run: timeout --signal=TERM 120s node tests/quick-plan-recommendations-v01942-e2e.js
      - name: Explainable planner audit
        run: timeout --signal=TERM 120s node tests/planner-audit-v01942-e2e.js
      - name: Source health and provenance
        run: timeout --signal=TERM 120s node tests/source-health-v01942-e2e.js
      - name: Planner runtime wiring
        run: timeout --signal=TERM 120s node tests/planner-runtime-wiring-v01942-e2e.js
      - name: Planner apply guard
        run: timeout --signal=TERM 120s node tests/planner-application-guard-v01942-e2e.js
      - name: Smartphone 390x844 practice regression
        run: timeout --signal=TERM 120s node tests/mobile-smoke.js
      - name: Wunsch Soll Freigabe Ist comparison
        run: timeout --signal=TERM 120s node tests/workflow-e2e.js
      - name: Roles permissions and read-only guards
        run: timeout --signal=TERM 120s node tests/roles-e2e.js
      - name: Documents PDF print email export
        run: timeout --signal=TERM 120s node tests/documents-e2e.js
      - name: Plan photo pipeline
        run: timeout --signal=TERM 120s node tests/photo-pipeline-e2e.js

      - name: Deep consolidation result
        run: |
          echo 'KC DP2 V0.19.45 DEEP CONSOLIDATION: GREEN'
          echo 'Release + Security + Architecture + Rules + Manager + Planner + UX + Mobile + Roles + Push + Diagnostics + PWA + Documents + Photo: PASS'

      - name: Test server log on failure
        if: failure()
        run: cat /tmp/kcdp-deep-http.log || true
