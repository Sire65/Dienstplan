name: KC DP2 V0.19.40 Rehash
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          f=release/v0.19.40/site/src/ui/mobile-day.js
          echo "BYTES=$(wc -c < "$f" | tr -d ' ')"
          echo "SHA256=$(sha256sum "$f" | awk '{print $1}')"
          node --check "$f"
