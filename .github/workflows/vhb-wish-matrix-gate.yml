name: KC DP2 V0.19.53 VHB Wish Matrix Gate

on:
  pull_request:
  push:
    branches: [feature-vhb-wish-matrix]

permissions:
  contents: read

jobs:
  vhb-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Refresh deterministic release manifest
        run: node scripts/refresh-update-manifest.js
      - name: V H B wish matrix contract
        run: node tests/vhb-wish-matrix-gate.js
