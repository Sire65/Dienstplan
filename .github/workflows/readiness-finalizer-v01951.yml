name: KC DP2 V0.19.51 Readiness Finalizer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kc-dp2-v01951-readiness-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'release/readiness-v01951-final')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/readiness-v01951-final
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Finalize runtime wiring and cryptographic manifest
        run: node scripts/finalize-v01951-readiness.js
      - name: Syntax check readiness modules
        run: |
          node --check release/v0.19.51/site/src/core/supabase-connection-monitor.js
          node --check release/v0.19.51/site/src/ui/diagnostics-history-view.js
          node --check release/v0.19.51/site/src/ui/excel-migration-center.js
          node --check scripts/finalize-v01951-readiness.js
      - name: Readiness regression gates
        run: |
          node tests/supabase-connection-monitor-v01951-gate.js
          node tests/diagnostics-history-v01951-gate.js
          node tests/excel-migration-v01951-gate.js
          node release/v0.19.51/tests/diagnostics-manager-center-contract.mjs
          node tests/tuev-studio-current.js
      - name: Commit generated release files to readiness branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Readiness tree already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize DP2 V0.19.51 readiness runtime and manifest'
          git push origin HEAD:release/readiness-v01951-final
