name: KC DP2 PR48 Manifest Refresh
on:
  push:
    branches: [fix/mobile-diagnostics-sw-noise-v01951]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mobile-diagnostics-sw-noise-v01951
      - name: Refresh runtime hashes
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const root='release/v0.19.51/site',mp=path.join(root,'update-manifest.json');
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          let total=0;
          for(const f of m.files){
            const p=path.join(root,f.path),b=fs.readFileSync(p);
            f.bytes=b.length;
            f.sha256=crypto.createHash('sha256').update(b).digest('hex');
            if(f.runtime) total+=b.length;
          }
          m.totalRuntimeBytes=total;
          m.generatedAt=new Date().toISOString();
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Commit refreshed manifest and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/manifest-refresh-pr48.yml
          git add release/v0.19.51/site/update-manifest.json
          git commit -m 'KC DP2: Release-Manifest nach Diagnose-Fix aktualisieren'
          git push origin HEAD:fix/mobile-diagnostics-sw-noise-v01951
