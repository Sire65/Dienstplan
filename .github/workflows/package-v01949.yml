name: KC DP2 V0.19.49 Pilot Completion Fix Package
on:
  push:
    branches: [pilot-thanks-fix]
    paths: ['.github/workflows/package-v01949.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pilot-thanks-fix
          fetch-depth: 0
      - name: Create canonical V0.19.49 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v0.19.49
          cp -a release/v0.19.48 release/v0.19.49
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          root=Path('release/v0.19.49/site')
          def repl(rel,a,b):
              p=root/rel;s=p.read_text(encoding='utf-8')
              if a not in s: print('WARN marker missing',rel,a)
              p.write_text(s.replace(a,b),encoding='utf-8')
          repl('index.html','V0.19.48','V0.19.49')
          repl('index.html',"EXPECTED='0.19.48'","EXPECTED='0.19.49'")
          repl('src/core/model.js',"K.VERSION='0.19.48'","K.VERSION='0.19.49'")
          repl('src/core/update-manager.js',"CURRENT_RELEASE='0.19.48'","CURRENT_RELEASE='0.19.49'")
          repl('src/core/update-manager.js',"version:'0.19.48'","version:'0.19.49'")
          repl('src/adapters/push.js','service-worker.js?v=0.19.48','service-worker.js?v=0.19.49')
          repl('src/adapters/push.js',"version:'0.19.48'","version:'0.19.49'")
          repl('src/ui/kc-ux-polish.js','0.19.48','0.19.49')
          repl('src/ui/source-health-ui.js',"K.sourceHealthUi={version:'0.19.48'","K.sourceHealthUi={version:'0.19.49'")
          repl('src/ui/source-health-ui.js','kc-ux-polish.css?v=0.19.48','kc-ux-polish.css?v=0.19.49')
          repl('src/ui/source-health-ui.js','kc-ux-polish.js?v=0.19.48','kc-ux-polish.js?v=0.19.49')
          mp=root/'update-manifest.json';m=json.loads(mp.read_text(encoding='utf-8'))
          m['version']='0.19.49';m['cacheName']='kc-dp-release-0.19.49';m['releaseNotes']=[
            'Pilot-Abschluss-Push kann bei Bedarf erneut gesendet werden',
            'Pilot-Subscription bleibt bis zur echten Öffnungsbestätigung aktiv',
            'Dankes-Push meldet Öffnung serverseitig als completion_received zurück',
            'Digitaler Dank mit Blumenstrauß für Pilot-Tester',
            'Pilot-Service-Worker-Cache auf V0.19.49 erneuert'
          ];m['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          total=0;seen=set()
          for f in m['files']:
              install=f.get('installPath') or f['path']
              if install in seen: raise SystemExit('duplicate manifest path '+install)
              seen.add(install);p=root/install
              if not p.is_file(): raise SystemExit('manifest file missing '+install)
              b=p.read_bytes();f['bytes']=len(b);f['sha256']=hashlib.sha256(b).hexdigest()
              if f.get('runtime',True): total+=len(b)
          m['totalRuntimeBytes']=total;mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('release/current.json').write_text(json.dumps({'app':'KC DP2','version':'0.19.49','mode':'verified-direct-site','baseVersion':'0.19.48','previousVersion':'0.19.48','releasePath':'release/v0.19.49/site'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('release/v0.19.49/RELEASE.txt').write_text('KC DP2 V0.19.49\n================\n\nPilot Completion Fix: zuverlässiger Dankes-Push mit echter Empfangsbestätigung.\n',encoding='utf-8')
          print('SEALED V0.19.49',len(m['files']),'files',total,'runtime bytes')
          PY
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find release/v0.19.49/site -type f -name '*.js' -print0)
          node tests/tuev-studio-current.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v0.19.49 release/current.json
          git commit -m 'release: create canonical KC DP2 V0.19.49 pilot completion fix'
          git fetch origin pilot-thanks-fix
          git rebase origin/pilot-thanks-fix
          git push origin HEAD:pilot-thanks-fix
