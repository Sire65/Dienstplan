name: KC DP2 V0.19.51 Readiness Finalizer

on:
  push:
    branches: [fix/diagnostics-history-v01951]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kc-dp2-v01951-readiness-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/diagnostics-history-v01951
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Finalize runtime wiring and cryptographic manifest
        run: node scripts/finalize-v01951-readiness.js
      - name: Syntax check changed readiness modules
        run: |
          node --check release/v0.19.51/site/src/core/supabase-connection-monitor.js
          node --check release/v0.19.51/site/src/ui/diagnostics-history-view.js
          node --check release/v0.19.51/site/src/ui/excel-migration-center.js
          node --check scripts/finalize-v01951-readiness.js
      - name: Readiness regression gates
        run: |
          node tests/supabase-connection-monitor-v01951-gate.js
          node tests/diagnostics-history-v01951-gate.js
          node tests/excel-migration-v01951-gate.js
          node release/v0.19.51/tests/diagnostics-manager-center-contract.mjs
          node tests/tuev-studio-current.js
      - name: Commit generated manifest and runtime wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Readiness tree already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v0.19.51/site/index.html \
                  release/v0.19.51/site/service-worker.js \
                  release/v0.19.51/site/update-manifest.json \
                  scripts/refresh-update-manifest.js \
                  release/v0.19.51/tests/diagnostics-manager-center-contract.mjs \
                  tests/tuev-studio-current.js \
                  .github/workflows/deep-consolidation-v01945.yml \
                  .github/workflows/full-acceptance.yml
          git commit -m 'Finalize DP2 V0.19.51 readiness manifest and runtime wiring'
          git push origin HEAD:fix/diagnostics-history-v01951
