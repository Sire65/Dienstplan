name: KC DP2 Validate V0.19.42 Package

on:
  workflow_dispatch:
  push:
    branches: [feature/pc-manager-leading-source-v01942]
    paths:
      - 'release/v0.19.42/**'
      - 'release/current.json'
      - '.github/workflows/package-v01942.yml'

permissions:
  contents: read

concurrency:
  group: kc-dp2-package-v01942
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate canonical V0.19.42 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          site=root/'release/v0.19.42/site'
          current=json.loads((root/'release/current.json').read_text(encoding='utf-8'))
          manifest=json.loads((site/'update-manifest.json').read_text(encoding='utf-8'))
          assert current['version']=='0.19.42'
          assert current['releasePath']=='release/v0.19.42/site'
          assert manifest['version']=='0.19.42'
          assert manifest['cacheName']=='kc-dp-release-0.19.42'
          total=0
          for item in manifest['files']:
              rel=item.get('installPath') or item['path']
              data=(site/rel).read_bytes()
              assert len(data)==int(item['bytes']), rel
              assert hashlib.sha256(data).hexdigest()==item['sha256'].lower(), rel
              if item.get('runtime',True): total+=len(data)
          assert total==int(manifest['totalRuntimeBytes'])
          assert (site/'RELEASE.txt').read_text(encoding='utf-8').strip()=='KC-DP2 0.19.42'
          print(f'V0.19.42 package validation PASS: {len(manifest["files"])} runtime entries, {total} bytes')
          PY
          node --check release/v0.19.42/site/service-worker.js
          node --check release/v0.19.42/site/src/adapters/push.js
          node --check release/v0.19.42/site/src/core/update-manager.js
