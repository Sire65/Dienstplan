name: KC DP2 Readiness External Audit Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/readiness-external-audit-once.yml']

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL readiness branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/readiness-v01951-final
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript-readiness

  semgrep:
    name: Semgrep readiness branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/readiness-v01951-final
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep>=1.130,<2'
      - name: Independent security scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            release/v0.19.51/site/src supabase
