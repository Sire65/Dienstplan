name: KC DP2 Verified Web Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify canonical V0.19.42 release
        shell: bash
        run: |
          set -euo pipefail
          node tests/tuev-studio-v01942.js
          node tests/local-xlsx-v01942-e2e.js
          node tests/push-receipt-v01942-e2e.js
          node --check release/v0.19.42/site/service-worker.js
          node --check release/v0.19.42/site/src/adapters/push.js
          node --check release/v0.19.42/site/src/core/update-manager.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/v0.19.42/site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
