name: KC-DP2 Verified Web Release

on:
  push:
    branches: [main, release-v01913-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and verify KC-DP2 V0.19.13
        run: python3 release/build_site.py 0.19.13
      - name: Verify performance and security invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build/site')
          storage=(root/'src/adapters/storage.js').read_text(encoding='utf-8')
          app=(root/'src/ui/app.js').read_text(encoding='utf-8')
          ux=(root/'src/ui/role-ux.js').read_text(encoding='utf-8')
          sync=(root/'src/adapters/sync.js').read_text(encoding='utf-8')
          recovery=(root/'src/core/recovery.js').read_text(encoding='utf-8')
          diagnostics=(root/'src/core/database-diagnostics.js').read_text(encoding='utf-8')
          mgr=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          assert 'KC_DP_LOCAL_V2' in storage
          assert '_localKeyPromise' in storage and 'ITERATIONS=310000' in storage
          assert 'PBKDF2-SHA-256' in storage and 'AES-256-GCM' in storage
          assert 'putMany(entries)' in storage and 'getMany(keys)' in storage
          assert 'KCSecureSync.decryptEnvelope' in storage
          assert 'K.storage.putMany' in app and 'K.storage.getMany' in app
          assert 'ensureFastLocalStore' in app and 'taskProgressOpen' in app
          assert 'Restzeit' in app and 'Laufzeit' in app
          assert 'Zeiten werden übernommen' in ux and 'Sollplan wird berechnet' in ux
          assert "emit('progress'" in sync and 'Synchronisation läuft' in app
          assert 'scheduleCheckpoint' in recovery and 'K.storage?.benchmark' in diagnostics
          assert "CURRENT_RELEASE='0.19.13'" in mgr
          print('V0.19.13 performance/security assertions OK')
          PY
      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v01913
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: kc-dp2-verified-site-v01913, path: build/site}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/site}
      - id: deployment
        uses: actions/deploy-pages@v4
