name: KC DP2 Verified Web Release

# Production stays canonical at site root. The repaired V0.19.55 candidate is
# additionally published under /handtest-v01955/ for real-device testing.
on:
  push:
    branches: [main]
    paths:
      - 'release/current.json'
      - 'release/v*/site/**'
      - 'scripts/refresh-update-manifest.js'
      - 'tests/**'
      - 'docs/KC-DP2-ENGINEERING-RULES.md'
      - '.github/workflows/deploy-kc-dp2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod
      - name: Checkout repaired handtest branch
        uses: actions/checkout@v6
        with:
          ref: repair/current-by-v01954
          path: repair
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve canonical current release
        id: release
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release/current.json').version")"
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          test "$RELEASE_PATH" = "release/v${VERSION}/site"
          test -f "$RELEASE_PATH/index.html"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
      - name: Refresh deterministic release manifest
        working-directory: prod
        run: node scripts/refresh-update-manifest.js
      - name: Verify canonical current release
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          node tests/tuev-studio-current.js
          node tests/ux-current-gate.js
          node tests/diagnostics-v01944-gate.js
          node release/v0.19.51/tests/diagnostics-manager-center-contract.mjs
          node tests/push-center-v01943-gate.js
          node tests/pilot-v01948-gate.js
          node tests/pilot-mobile-secure-gate.js
          node tests/installation-history-gate.js
          node tests/admin-push-settings-gate.js
          ROOT="${{ steps.release.outputs.path }}"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$ROOT" -type f -name '*.js' -print0)
      - name: Verify isolated handtest candidate exists
        shell: bash
        run: |
          set -euo pipefail
          test -f repair/release/v0.19.55/site/index.html
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find repair/release/v0.19.55/site -type f -name '*.js' -print0)
      - name: Build combined Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -a "prod/${{ steps.release.outputs.path }}/." dist/
          mkdir -p dist/handtest-v01955
          cp -a repair/release/v0.19.55/site/. dist/handtest-v01955/
          printf '%s\n' "production=${{ steps.release.outputs.version }}" "handtest=0.19.55" > dist/HANDTEST_BUILD.txt
          test -f dist/index.html
          test -f dist/handtest-v01955/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
