name: KC-DP2 Verified Web Release

on:
  push:
    branches: [main, release-v01910-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified V0.19.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 release/v0.19.0/fix08/part{00..02}.b64 release/v0.19.0/part{09..10}.b64 release/v0.19.0/tail8/part{00..12}.b64 release/v0.19.0/tail1k/part{000..040}.b64 > /tmp/base.b64
          test "$(wc -c < /tmp/base.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "246c8ef625280337d4ba309e34862c2fdce2ba8023313f2d9f75426cf1ffc80e  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi

      - name: Apply KC-DP2 release deltas V0.19.1-V0.19.10
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.1/apply.py")
          cat release/v0.19.1/assets/startbild-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          cat release/v0.19.1/assets/logo-*.b64 | base64 --decode > build/site/assets/kc-login-logo.webp
          for v in 0.19.2 0.19.3 0.19.4 0.19.5 0.19.6 0.19.7; do (cd build/site && python3 "$GITHUB_WORKSPACE/release/v${v}/apply.py"); done
          cat release/v0.19.7/assets/bg-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.8/apply.py")
          cat release/v0.19.8/assets/bg-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          echo "c2e250d35eba2a098cd27af353820c56e8da305998321573a1119579e077dee9  build/site/assets/kc-login-startbild.webp" | sha256sum -c -
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.9/apply.py")
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.10/apply.py")

      - name: Build V0.19.10 recovery manifest and files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site/__update
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('build/site')
          template=json.loads(Path('release/v0.19.5/update-manifest.json').read_text(encoding='utf-8'))
          files=[]; total=0
          for old in template['files']:
              install=old.get('installPath') or old['path']; p=root/install
              if not p.is_file(): raise SystemExit(f'Kanonische Datei fehlt: {install}')
              data=p.read_bytes(); runtime=old.get('runtime') is not False
              item={'path':f'__update/0.19.10/{install}' if runtime else install,'installPath':install,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'runtime':runtime}
              files.append(item)
              if runtime:
                  dst=root/item['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst); total+=len(data)
          manifest={'schema':'KC_DP_UPDATE_MANIFEST_V1','app':'KC-DP2','version':'0.19.10','cacheName':'kc-dp-release-0.19.10','releaseNotes':['IndexedDB Traffic-LED zeigt echte Lese-/Schreib-/Löschaktivität','LED-Schnelltests zeigen Messwerte in Millisekunden und bleiben sichtbar','Datenbank-Kompletttest zeigt lokale, Cloud- und Roundtrip-Messwerte live'],'generatedAt':'2026-08-12T15:45:00Z','totalRuntimeBytes':total,'files':files}
          (root/'update-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'RELEASE.txt').write_text('KC-DP2 0.19.10\n',encoding='utf-8')
          (root/'.nojekyll').touch()
          PY

      - name: Verify KC-DP2 V0.19.10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('build/site'); m=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='0.19.10'; total=0
          for f in m['files']:
              data=(root/f['installPath']).read_bytes(); h=hashlib.sha256(data).hexdigest()
              if len(data)!=f['bytes'] or h!=f['sha256']: raise SystemExit(f'Integrität falsch: {f["installPath"]}')
              if f.get('runtime') is not False:
                  r=root/f['path']
                  if not r.is_file() or r.read_bytes()!=data: raise SystemExit(f'Recovery falsch: {f["installPath"]}')
                  total+=len(data)
          if total!=m['totalRuntimeBytes']: raise SystemExit('Runtime-Gesamtgröße falsch')
          expected={
            'index.html':'20c6cd73c1d745914bf1630a1b4b1fbda02373e85661b8849a4d33b1d5193ed9',
            'service-worker.js':'8281c7bd3c46f97f1ae86355ccd72d08bad410732e611e03d631dfad01762d1f',
            'src/core/update-manager.js':'25a04969aee2f5faccaab969e2face7d9e3148e8727c3096873ba9d14e4e6285',
            'src/ui/update-ui.js':'5004381dea54b77209f67106449300adebaf401a484fd1ab04bb5bf6566481c8',
            'src/ui/role-ux.js':'963baa9d87e583d043ddf16e434216dd6d563bed141103203d10741573aabe18',
            'src/core/integrations.js':'4c797404a1d256d4e819fa601db5b0cb02931e5635a7c85ddfe8607b3ed5aa38',
            'src/ui/app.js':'712a7be524ed01c33e39606c7cdb127d5cae6974f72398441965bbed997e5bf3',
            'src/ui/app.css':'44b9e72286055533282a171237ba76a1455fcdd921ec085bca34ddd54486075e',
            'src/adapters/storage.js':'8f7814791638f878e4ee06bd7bdfef7b584f1b99099b80b1cc1f5e844bacde46',
            'src/core/database-diagnostics.js':'150652a36057dbc78e491abd4d551e04ec724b566e7a8fe1e20aac7a7fa2c588',
            'src/adapters/supabase-provider.js':'c4c97658991a5748768c3a17c847dee29213ba07edc963e1394eb67929287c11',
            'RELEASE.txt':'46ba8bb7ffdd806b139aa8392cf87365257931da8977b10ff9b5f73c2a83bc89'}
          for rel,want in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'Lokaler Release-Hash weicht ab: {rel} {got} != {want}')
          app=(root/'src/ui/app.js').read_text(encoding='utf-8')
          storage=(root/'src/adapters/storage.js').read_text(encoding='utf-8')
          css=(root/'src/ui/app.css').read_text(encoding='utf-8')
          mgr=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          for t in ("window.addEventListener('KC_DP_IDB_TRAFFIC'",'dbTestMetrics','Roundtrip <b>${fmtMs(syncStep?.latencyMs)}</b>','Die Messwerte bleiben bis zum Schließen sichtbar.'):
              if t not in app: raise SystemExit('V0.19.10 Diagnose fehlt: '+t)
          for t in ("idbTraffic('put')","idbTraffic('get')","idbTraffic('remove')"):
              if t not in storage: raise SystemExit('IndexedDB Traffic fehlt: '+t)
          if '.db-test-metrics' not in css: raise SystemExit('Diagnose-CSS fehlt')
          if "CURRENT_RELEASE='0.19.10'" not in mgr: raise SystemExit('Release-Version falsch')
          print(f'KC-DP2 V0.19.10 verification OK: {len(m["files"])} Dateien, {total} Runtime-Bytes')
          PY

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v01910
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: kc-dp2-verified-site-v01910, path: build/site}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/site}
      - id: deployment
        uses: actions/deploy-pages@v4
