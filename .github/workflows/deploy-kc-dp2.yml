name: KC-DP2 Verified Web Release

on:
  push:
    branches:
      - main
      - release-v019-staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and verify KC-DP2 V0.19.0
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' release/current.json)"
          RELEASE_FILE="$(jq -r '.release' release/current.json)"
          EXPECTED_SHA="$(jq -r '.sha256' release/current.json)"
          mkdir -p "$(dirname "$RELEASE_FILE")" build/unpacked build/site

          cat release/v0.19.0/part{00..07}.b64 \
              release/v0.19.0/fix08/part{00..02}.b64 \
              release/v0.19.0/part{09..10}.b64 \
              release/v0.19.0/tail8/part{00..12}.b64 \
              release/v0.19.0/tail1k/part{000..040}.b64 \
              > /tmp/kc-dp2-release.b64

          ACTUAL_B64="$(wc -c < /tmp/kc-dp2-release.b64 | tr -d ' ')"
          if [ "$ACTUAL_B64" != "318168" ]; then
            echo "::error::Base64-Laenge ist $ACTUAL_B64 statt 318168. Deployment gestoppt."
            exit 20
          fi

          base64 --decode /tmp/kc-dp2-release.b64 > "$RELEASE_FILE"
          echo "$EXPECTED_SHA  $RELEASE_FILE" | sha256sum -c -
          unzip -q "$RELEASE_FILE" -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi
          for REQUIRED in index.html manifest.webmanifest service-worker.js update-manifest.json; do
            test -f "build/site/$REQUIRED" || { echo "::error::Pflichtdatei fehlt: $REQUIRED"; exit 21; }
          done
          printf 'KC-DP2 %s\n' "$VERSION" > build/site/RELEASE.txt
          touch build/site/.nojekyll

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site
          path: build/site
          if-no-files-found: error
          retention-days: 2

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct verified site for Pages
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_FILE="$(jq -r '.release' release/current.json)"
          EXPECTED_SHA="$(jq -r '.sha256' release/current.json)"
          VERSION="$(jq -r '.version' release/current.json)"
          mkdir -p "$(dirname "$RELEASE_FILE")" build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 \
              release/v0.19.0/fix08/part{00..02}.b64 \
              release/v0.19.0/part{09..10}.b64 \
              release/v0.19.0/tail8/part{00..12}.b64 \
              release/v0.19.0/tail1k/part{000..040}.b64 \
              > /tmp/kc-dp2-release.b64
          test "$(wc -c < /tmp/kc-dp2-release.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/kc-dp2-release.b64 > "$RELEASE_FILE"
          echo "$EXPECTED_SHA  $RELEASE_FILE" | sha256sum -c -
          unzip -q "$RELEASE_FILE" -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi
          for REQUIRED in index.html manifest.webmanifest service-worker.js update-manifest.json; do test -f "build/site/$REQUIRED"; done
          printf 'KC-DP2 %s\n' "$VERSION" > build/site/RELEASE.txt
          touch build/site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
