name: KC-DP2 Verified Web Release

on:
  push:
    branches:
      - main
      - release-v0195-staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified V0.19.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 \
              release/v0.19.0/fix08/part{00..02}.b64 \
              release/v0.19.0/part{09..10}.b64 \
              release/v0.19.0/tail8/part{00..12}.b64 \
              release/v0.19.0/tail1k/part{000..040}.b64 > /tmp/kc-dp2-v0190.b64
          test "$(wc -c < /tmp/kc-dp2-v0190.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/kc-dp2-v0190.b64 > /tmp/kc-dp2-v0190.zip
          echo "246c8ef625280337d4ba309e34862c2fdce2ba8023313f2d9f75426cf1ffc80e  /tmp/kc-dp2-v0190.zip" | sha256sum -c -
          unzip -q /tmp/kc-dp2-v0190.zip -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi

      - name: Apply KC-DP2 release deltas V0.19.1-V0.19.5
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.1/apply.py")
          cat release/v0.19.1/assets/startbild-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          cat release/v0.19.1/assets/logo-*.b64 | base64 --decode > build/site/assets/kc-login-logo.webp
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.2/apply.py")
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.3/apply.py")
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.4/apply.py")
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.5/apply.py")

      - name: Build V0.19.5 recovery files from exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site/__update
          cp release/v0.19.5/update-manifest.json build/site/update-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('build/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          if manifest['version']!='0.19.5': raise SystemExit('Falsche Manifest-Version')
          for item in manifest['files']:
              if item.get('runtime') is False: continue
              src=root/item['installPath']
              if not src.is_file(): raise SystemExit(f"Kanonische Datei fehlt: {item['installPath']}")
              dst=root/item['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          (root/'RELEASE.txt').write_text('KC-DP2 0.19.5\n',encoding='utf-8')
          (root/'.nojekyll').touch()
          PY

      - name: Verify KC-DP2 V0.19.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('build/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema']=='KC_DP_UPDATE_MANIFEST_V1'
          assert manifest['app']=='KC-DP2'
          assert manifest['version']=='0.19.5'
          total=0
          for item in manifest['files']:
              install=item.get('installPath') or item['path']; canonical=root/install
              if not canonical.is_file(): raise SystemExit(f'Fehlt: {install}')
              data=canonical.read_bytes(); actual=hashlib.sha256(data).hexdigest()
              if len(data)!=item['bytes']: raise SystemExit(f'Größe falsch: {install}')
              if actual!=item['sha256']: raise SystemExit(f'SHA-256 falsch: {install} {actual} != {item["sha256"]}')
              if item.get('runtime') is not False:
                  recovery=root/item['path']
                  if not recovery.is_file() or recovery.read_bytes()!=data: raise SystemExit(f'Recovery falsch: {install}')
                  total+=len(data)
          if total!=manifest['totalRuntimeBytes']: raise SystemExit(f'Runtime-Gesamtgröße falsch: {total}')
          role=(root/'src/ui/role-ux.js').read_text(encoding='utf-8')
          css=(root/'src/ui/role-ux.css').read_text(encoding='utf-8')
          mgr=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          for token in ('placeholder="z. B. Ihr persönliches Passwort"','ux-login-divider','uxUpdateCheck'):
              if token not in role: raise SystemExit(f'Login-Finishing fehlt: {token}')
          for token in ('V0.19.5 LOGIN-FINISH','width:min(1380px','width:min(650px','background-size:450% auto','background-size:330% auto','kc-login-startbild.webp'):
              if token not in css: raise SystemExit(f'Layout-Finishing fehlt: {token}')
          for token in ("CURRENT_RELEASE='0.19.5'",'},1500)','visibilitychange'):
              if token not in mgr: raise SystemExit(f'Update-Test-Voraussetzung fehlt: {token}')
          print(f"KC-DP2 V0.19.5 verification OK: {len(manifest['files'])} Dateien, {total} Runtime-Bytes")
          PY

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v0195
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: kc-dp2-verified-site-v0195
          path: build/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
