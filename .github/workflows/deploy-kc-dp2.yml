name: KC DP2 Verified Web Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and verify V0.19.42
        run: |
          rm -rf build/site
          mkdir -p build
          cp -a release/v0.19.42/site build/site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          old=Path('release/v0.19.41/site')
          src=Path('release/v0.19.42/site')
          root=Path('build/site')
          current=json.loads(Path('release/current.json').read_text(encoding='utf-8'))
          assert current['version']=='0.19.42'
          assert current['baseVersion']=='0.19.41'
          assert current['previousVersion']=='0.19.41'
          assert current['releasePath']=='release/v0.19.42/site'

          integrations=(src/'src/core/integrations.js').read_text(encoding='utf-8')
          xlsx=(src/'src/adapters/xlsx-local.js').read_text(encoding='utf-8')
          updater=(src/'src/core/update-manager.js').read_text(encoding='utf-8')
          role=(src/'src/ui/role-ux.js').read_text(encoding='utf-8')
          assert "xlsx-local.js?v=0.19.42" in integrations
          assert "version:'0.19.42'" in integrations
          assert "CURRENT_RELEASE='0.19.42'" in updater
          assert "version:'0.19.42'" in updater
          assert 'service-worker.js?v=0.19.42-engine' in updater
          assert "window.XLSX={version:'KC-local-1.0'" in xlsx
          assert 'function inflate(src)' in xlsx and 'function unzip(buf)' in xlsx
          assert 'sharedStrings.xml' in xlsx and 'worksheets' in xlsx
          assert 'if(window.XLSX)return window.XLSX' in role

          allowed={'src/core/integrations.js','src/core/update-manager.js','src/adapters/xlsx-local.js','update-manifest.json'}
          old_files={p.relative_to(old).as_posix() for p in old.rglob('*') if p.is_file()}
          new_files={p.relative_to(src).as_posix() for p in src.rglob('*') if p.is_file()}
          added=new_files-old_files
          removed=old_files-new_files
          assert added=={'src/adapters/xlsx-local.js'}, added
          assert not removed, removed
          changed=set()
          for rel in old_files & new_files:
              if (old/rel).read_bytes() != (src/rel).read_bytes(): changed.add(rel)
          assert changed <= allowed, changed
          assert {'src/core/integrations.js','src/core/update-manager.js'} <= changed

          paths=['src/core/integrations.js','src/adapters/xlsx-local.js','src/core/update-manager.js']
          files=[]
          for rel in paths:
              data=(root/rel).read_bytes()
              files.append({'path':rel,'installPath':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'runtime':True})
          manifest={
            'schema':'KC_DP_UPDATE_MANIFEST_V1','app':'KC DP2','version':'0.19.42',
            'cacheName':'kc-dp-release-0.19.42',
            'releaseNotes':['Excel-/XLSX-Import arbeitet lokal und offline ohne notwendige CDN-Abhängigkeit','Dediziertes KC-DP2-Supabase-Projekt und bestehende V0.19.41-Funktionen bleiben unverändert','Update-Engine und Release-Hashes wurden auf V0.19.42 angehoben'],
            'generatedAt':'2026-08-15T08:20:00+02:00','totalRuntimeBytes':sum(x['bytes'] for x in files),'files':files
          }
          (root/'update-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          check=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert check['totalRuntimeBytes']==sum(x['bytes'] for x in check['files'])
          for item in check['files']:
              data=(root/item['path']).read_bytes()
              assert len(data)==item['bytes']
              assert hashlib.sha256(data).hexdigest()==item['sha256']
          print('V0.19.42 Releasebaum, lokaler XLSX-Reader und SHA-256-Manifest OK')
          PY

      - name: JavaScript syntax and inherited regression gates
        run: |
          node --check build/site/src/adapters/xlsx-local.js
          node --check build/site/src/core/integrations.js
          node --check build/site/src/core/update-manager.js
          node --check build/site/service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build/site')
          assert 'kc-login-startbild-v01917.webp' in (root/'src/ui/role-ux.css').read_text(encoding='utf-8')
          assert 'E-Mail-Adresse oder Passwort ist falsch.' in (root/'src/adapters/supabase-provider.js').read_text(encoding='utf-8')
          assert 'ptblnpiroqftcvlsrhac' in (root/'src/core/integrations.js').read_text(encoding='utf-8')
          assert 'Push-Benachrichtigungen' in (root/'src/ui/role-ux.js').read_text(encoding='utf-8')
          assert 'IndexedDB- und Performance-Center' in (root/'src/ui/app.js').read_text(encoding='utf-8')
          assert 'ensureSession' in (root/'src/adapters/sync.js').read_text(encoding='utf-8')
          assert 'K.isSpecialShift' in (root/'src/core/planning.js').read_text(encoding='utf-8')
          assert 'matrix-time-row' in (root/'src/ui/app.js').read_text(encoding='utf-8')
          assert 'Automatischer verschlüsselter IndexedDB-Test erfolgreich' in (root/'src/ui/app.js').read_text(encoding='utf-8')
          assert 'dayHours>oldDayHours+1e-9' in (root/'src/core/staffing.js').read_text(encoding='utf-8')
          assert 'colorLegendBtn' in (root/'index.html').read_text(encoding='utf-8')
          print('Geerbte KC-DP2 Regression-Gates OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v01942
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: kc-dp2-verified-site-v01942, path: build/site}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/site}
      - id: deployment
        uses: actions/deploy-pages@v4
