name: KC-DP2 Verified Web Release

on:
  push:
    branches:
      - main
      - release-v0193-staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified V0.19.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 \
              release/v0.19.0/fix08/part{00..02}.b64 \
              release/v0.19.0/part{09..10}.b64 \
              release/v0.19.0/tail8/part{00..12}.b64 \
              release/v0.19.0/tail1k/part{000..040}.b64 \
              > /tmp/kc-dp2-v0190.b64
          test "$(wc -c < /tmp/kc-dp2-v0190.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/kc-dp2-v0190.b64 > /tmp/kc-dp2-v0190.zip
          echo "246c8ef625280337d4ba309e34862c2fdce2ba8023313f2d9f75426cf1ffc80e  /tmp/kc-dp2-v0190.zip" | sha256sum -c -
          unzip -q /tmp/kc-dp2-v0190.zip -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi

      - name: Apply KC-DP2 V0.19.1 delta
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.1/apply.py")
          cat release/v0.19.1/assets/startbild-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          cat release/v0.19.1/assets/logo-*.b64 | base64 --decode > build/site/assets/kc-login-logo.webp
          cp release/v0.19.1/update-manifest.json build/site/update-manifest.json

      - name: Apply KC-DP2 V0.19.2 update-engine hotfix
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.2/apply.py")
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('build/site')
          meta=json.loads(Path('release/v0.19.2/meta.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          manifest['version']=meta['version']; manifest['cacheName']=meta['cacheName']; manifest['generatedAt']=meta['generatedAt']; manifest['releaseNotes']=meta['releaseNotes']
          total=0
          for item in manifest['files']:
              p=root/item['path']; data=p.read_bytes(); item['bytes']=len(data); item['sha256']=hashlib.sha256(data).hexdigest()
              if item.get('runtime') is not False: total+=len(data)
          manifest['totalRuntimeBytes']=total
          (root/'update-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Apply KC-DP2 V0.19.3 bootstrap recovery
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.3/apply.py")
          cp release/v0.19.3/update-manifest.json build/site/update-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('build/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          for item in manifest['files']:
              if item.get('runtime') is False: continue
              src=root/item['installPath']
              dst=root/item['path']
              if not src.is_file(): raise SystemExit(f"Kanonische Quelldatei fehlt: {item['installPath']}")
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
          PY
          printf 'KC-DP2 0.19.3\n' > build/site/RELEASE.txt
          touch build/site/.nojekyll

      - name: Verify KC-DP2 V0.19.3 bootstrap recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('build/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema']=='KC_DP_UPDATE_MANIFEST_V1'
          assert manifest['app']=='KC-DP2'
          assert manifest['version']=='0.19.3'
          runtime=[x for x in manifest['files'] if x.get('runtime') is not False]
          if not runtime: raise SystemExit('Keine Runtime-Dateien im Manifest')
          total=0
          install_paths=set()
          for item in manifest['files']:
              install=item.get('installPath') or item['path']
              if install in install_paths: raise SystemExit(f"Doppelter Installationspfad: {install}")
              install_paths.add(install)
              canonical=root/install
              if not canonical.is_file(): raise SystemExit(f"Kanonische Datei fehlt: {install}")
              cdata=canonical.read_bytes()
              actual=hashlib.sha256(cdata).hexdigest()
              if len(cdata)!=item['bytes']: raise SystemExit(f"Dateigroesse falsch: {install} {len(cdata)} != {item['bytes']}")
              if actual!=item['sha256']: raise SystemExit(f"SHA-256 falsch: {install} {actual} != {item['sha256']}")
              if item.get('runtime') is not False:
                  if not item['path'].startswith('__update/0.19.3/'): raise SystemExit(f"Recovery-Pfad fehlt: {item['path']}")
                  recovery=root/item['path']
                  if not recovery.is_file(): raise SystemExit(f"Recovery-Datei fehlt: {item['path']}")
                  rdata=recovery.read_bytes()
                  if rdata!=cdata: raise SystemExit(f"Recovery-Datei weicht ab: {install}")
                  if hashlib.sha256(rdata).hexdigest()!=item['sha256']: raise SystemExit(f"Recovery-SHA falsch: {install}")
                  total+=len(cdata)
          if total!=manifest['totalRuntimeBytes']: raise SystemExit(f"Runtime-Groesse falsch: {total} != {manifest['totalRuntimeBytes']}")
          mgr=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for token in ('file?.installPath||file?.path','file?.downloadPath||file?.path','sameOriginUrl(installPath(file),false)'):
              if token not in mgr: raise SystemExit(f"Updater-Recoverylogik fehlt: {token}")
          for token in ('f.installPath||f.path','f.downloadPath||f.path','normalizeRecoveryCache'):
              if token not in sw: raise SystemExit(f"Service-Worker-Recoverylogik fehlt: {token}")
          print(f"KC-DP2 V0.19.3 bootstrap verification OK: {len(manifest['files'])} Dateien, {total} Runtime-Bytes")
          PY

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v0193
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: kc-dp2-verified-site-v0193
          path: build/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
