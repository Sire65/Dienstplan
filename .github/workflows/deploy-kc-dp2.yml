name: KC-DP2 Verified Web Release

on:
  push:
    branches:
      - main
      - release-v0194-staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified V0.19.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 \
              release/v0.19.0/fix08/part{00..02}.b64 \
              release/v0.19.0/part{09..10}.b64 \
              release/v0.19.0/tail8/part{00..12}.b64 \
              release/v0.19.0/tail1k/part{000..040}.b64 \
              > /tmp/kc-dp2-v0190.b64
          test "$(wc -c < /tmp/kc-dp2-v0190.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/kc-dp2-v0190.b64 > /tmp/kc-dp2-v0190.zip
          echo "246c8ef625280337d4ba309e34862c2fdce2ba8023313f2d9f75426cf1ffc80e  /tmp/kc-dp2-v0190.zip" | sha256sum -c -
          unzip -q /tmp/kc-dp2-v0190.zip -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi

      - name: Apply KC-DP2 V0.19.1 login design
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.1/apply.py")
          cat release/v0.19.1/assets/startbild-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          cat release/v0.19.1/assets/logo-*.b64 | base64 --decode > build/site/assets/kc-login-logo.webp

      - name: Apply KC-DP2 V0.19.2 update-engine hotfix
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.2/apply.py")

      - name: Apply KC-DP2 V0.19.3 bootstrap recovery
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.3/apply.py")

      - name: Apply KC-DP2 V0.19.4 login/update UX hotfix
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.4/apply.py")

      - name: Build V0.19.4 recovery manifest and files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root=Path('build/site')
          template=json.loads(Path('release/v0.19.3/update-manifest.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('release/v0.19.4/meta.json').read_text(encoding='utf-8'))
          files=[]; total=0
          for old in template['files']:
              install=old.get('installPath') or old['path']
              canonical=root/install
              if not canonical.is_file(): raise SystemExit(f'Kanonische Datei fehlt: {install}')
              data=canonical.read_bytes(); runtime=old.get('runtime') is not False
              item={'path':f"__update/0.19.4/{install}" if runtime else install,'installPath':install,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'runtime':runtime}
              files.append(item)
              if runtime:
                  dst=root/item['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(canonical,dst); total+=len(data)
          manifest={'schema':'KC_DP_UPDATE_MANIFEST_V1','app':'KC-DP2','version':meta['version'],'cacheName':meta['cacheName'],'releaseNotes':meta['releaseNotes'],'generatedAt':meta['generatedAt'],'totalRuntimeBytes':total,'files':files}
          (root/'update-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'RELEASE.txt').write_text('KC-DP2 0.19.4\n',encoding='utf-8')
          (root/'.nojekyll').touch()
          PY

      - name: Verify KC-DP2 V0.19.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('build/site'); manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['version']=='0.19.4'
          total=0
          for item in manifest['files']:
              install=item.get('installPath') or item['path']; canonical=root/install
              if not canonical.is_file(): raise SystemExit(f'Fehlt: {install}')
              data=canonical.read_bytes(); h=hashlib.sha256(data).hexdigest()
              if len(data)!=item['bytes'] or h!=item['sha256']: raise SystemExit(f'Integrität falsch: {install}')
              if item.get('runtime') is not False:
                  recovery=root/item['path']
                  if not recovery.is_file() or recovery.read_bytes()!=data: raise SystemExit(f'Recovery falsch: {install}')
                  total+=len(data)
          if total!=manifest['totalRuntimeBytes']: raise SystemExit('Runtime-Gesamtgröße falsch')
          role=(root/'src/ui/role-ux.js').read_text(encoding='utf-8'); css=(root/'src/ui/role-ux.css').read_text(encoding='utf-8'); mgr=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          for token in ('name="kc_dp_member_email"','supabase\\.co','uxUpdateCheck','Update prüfen'):
              if token not in role: raise SystemExit(f'Login-Fix fehlt: {token}')
          for token in ('width:min(1480px','background-size:380% auto','background-position:left center','background-position:right center'):
              if token not in css: raise SystemExit(f'Layout-Fix fehlt: {token}')
          for token in ("CURRENT_RELEASE='0.19.4'",'},1500)','visibilitychange'):
              if token not in mgr: raise SystemExit(f'Update-Fix fehlt: {token}')
          print(f"KC-DP2 V0.19.4 verification OK: {len(manifest['files'])} Dateien, {total} Runtime-Bytes")
          PY

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v0194
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: kc-dp2-verified-site-v0194
          path: build/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
