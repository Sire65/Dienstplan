name: KC DP2 Verified Web Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: false

# Deploy source includes the verified V0.19.41 push-receipt service-worker hotfix and privileged self-push test button.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dedicated-supabase-v01941

      - name: Verify V0.19.41 handtest release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('release/v0.19.41/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert manifest['version']=='0.19.41'
          assert manifest['cacheName']=='kc-dp-release-0.19.41'
          integ=(root/'src/core/integrations.js').read_text(encoding='utf-8')
          push=(root/'src/adapters/push.js').read_text(encoding='utf-8')
          upd=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          assert "DEDICATED_REF='ptblnpiroqftcvlsrhac'" in integ
          assert "profile:'KC_DP_DEDICATED_PROJECT'" in integ
          assert "version:'0.19.41'" in push
          assert 'reconcileExisting' in push
          assert 'sendSelfTest' in push
          assert 'kc-dp-self-push-test' in push
          assert "CURRENT_RELEASE='0.19.41'" in upd
          print('V0.19.41 real-device handtest: PASS')
          PY
          node --check release/v0.19.41/site/src/core/integrations.js
          node --check release/v0.19.41/site/src/adapters/push.js
          node --check release/v0.19.41/site/src/core/update-manager.js
          node --check release/v0.19.41/site/service-worker.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/v0.19.41/site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
