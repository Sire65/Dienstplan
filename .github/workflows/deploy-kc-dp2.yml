name: KC-DP2 Verified Web Release

on:
  push:
    branches: [main, release-v0198-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct verified V0.19.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unpacked build/site
          cat release/v0.19.0/part{00..07}.b64 release/v0.19.0/fix08/part{00..02}.b64 release/v0.19.0/part{09..10}.b64 release/v0.19.0/tail8/part{00..12}.b64 release/v0.19.0/tail1k/part{000..040}.b64 > /tmp/base.b64
          test "$(wc -c < /tmp/base.b64 | tr -d ' ')" = "318168"
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          echo "246c8ef625280337d4ba309e34862c2fdce2ba8023313f2d9f75426cf1ffc80e  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d build/unpacked
          TOP="$(find build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. build/site/; else cp -a build/unpacked/. build/site/; fi
      - name: Apply KC-DP2 release deltas V0.19.1-V0.19.8
        shell: bash
        run: |
          set -euo pipefail
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.1/apply.py")
          cat release/v0.19.1/assets/startbild-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          cat release/v0.19.1/assets/logo-*.b64 | base64 --decode > build/site/assets/kc-login-logo.webp
          for v in 0.19.2 0.19.3 0.19.4 0.19.5 0.19.6 0.19.7; do (cd build/site && python3 "$GITHUB_WORKSPACE/release/v${v}/apply.py"); done
          cat release/v0.19.7/assets/bg-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          (cd build/site && python3 "$GITHUB_WORKSPACE/release/v0.19.8/apply.py")
          cat release/v0.19.8/assets/bg-*.b64 | base64 --decode > build/site/assets/kc-login-startbild.webp
          echo "c2e250d35eba2a098cd27af353820c56e8da305998321573a1119579e077dee9  build/site/assets/kc-login-startbild.webp" | sha256sum -c -
      - name: Build V0.19.8 recovery manifest and files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/site/__update
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('build/site'); template=json.loads(Path('release/v0.19.5/update-manifest.json').read_text(encoding='utf-8'))
          files=[]; total=0
          for old in template['files']:
              install=old.get('installPath') or old['path']; p=root/install
              if not p.is_file(): raise SystemExit(f'Kanonische Datei fehlt: {install}')
              data=p.read_bytes(); runtime=old.get('runtime') is not False
              item={'path':f'__update/0.19.8/{install}' if runtime else install,'installPath':install,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'runtime':runtime}; files.append(item)
              if runtime:
                  dst=root/item['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst); total+=len(data)
          manifest={'schema':'KC_DP_UPDATE_MANIFEST_V1','app':'KC-DP2','version':'0.19.8','cacheName':'kc-dp-release-0.19.8','releaseNotes':['Login-Hintergrund final proportional eingebaut','Kein starker Zoom und keine Schattenkante','Post-it und Holzbrett deutlich vollständiger sichtbar','Login-/Autofill-Fix aus V0.19.7 unverändert beibehalten','Update-Test V0.19.7 auf V0.19.8'],'generatedAt':'2026-08-12T12:55:00Z','totalRuntimeBytes':total,'files':files}
          (root/'update-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'RELEASE.txt').write_text('KC-DP2 0.19.8\n',encoding='utf-8'); (root/'.nojekyll').touch()
          PY
      - name: Verify KC-DP2 V0.19.8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('build/site'); m=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='0.19.8'; total=0
          for f in m['files']:
              data=(root/f['installPath']).read_bytes(); h=hashlib.sha256(data).hexdigest()
              if len(data)!=f['bytes'] or h!=f['sha256']: raise SystemExit(f'Integrität falsch: {f["installPath"]}')
              if f.get('runtime') is not False:
                  r=root/f['path']
                  if not r.is_file() or r.read_bytes()!=data: raise SystemExit(f'Recovery falsch: {f["installPath"]}')
                  total+=len(data)
          if total!=m['totalRuntimeBytes']: raise SystemExit('Runtime-Gesamtgröße falsch')
          expected={'index.html':'1cc6ce60c4ad8f2c4d9f4406ba8e3e1ab5982cfdc06ddc27467cb17740c01cc6','service-worker.js':'690d92cd3d32e7ec76ace915d23f302e0c421895f6233ccd255e8ef1e1e20393','src/core/update-manager.js':'fd8fd5d9c0a2ac05415cc8c210ebe55f29dc83b3da1e1c3210113a4668095228','src/ui/update-ui.js':'effbfcc26092e6c493a2af9a545c7199252e4ec756087cb1cf1abc5b424debdd','src/ui/role-ux.js':'2403f713dbef884f86281bf508d145e5e3dc8007d44c2fd71d9ecdefd0a66ec7','src/ui/role-ux.css':'24ab9d979f45363f1b433c8801830d2f1304c1af60b624bc299f0481ac3f5e9c','assets/kc-login-startbild.webp':'c2e250d35eba2a098cd27af353820c56e8da305998321573a1119579e077dee9','RELEASE.txt':'bec32ab991fd44d9e1a658cf07f5a876d70a7e4c02886cff6175541949d872d1'}
          for rel,want in expected.items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'Lokaler Release-Hash weicht ab: {rel} {got} != {want}')
          css=(root/'src/ui/role-ux.css').read_text(); role=(root/'src/ui/role-ux.js').read_text(); mgr=(root/'src/core/update-manager.js').read_text()
          for t in ('V0.19.8 FINAL-BACKGROUND','background-size:100% 100%','content:none!important'):
              if t not in css: raise SystemExit('Background-Fix fehlt: '+t)
          for t in ('ux-autofill-trap','scrubBadAutofill','supabase\\.co'):
              if t not in role: raise SystemExit('Autofill-Schutz fehlt: '+t)
          if "CURRENT_RELEASE='0.19.8'" not in mgr: raise SystemExit('Release-Version falsch')
          print(f'KC-DP2 V0.19.8 verification OK: {len(m["files"])} Dateien, {total} Runtime-Bytes')
          PY
      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-dp2-verified-site-v0198
          path: build/site
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: kc-dp2-verified-site-v0198, path: build/site}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/site}
      - id: deployment
        uses: actions/deploy-pages@v4
