name: KC DP2 Verified Web Release

# Production stays canonical at site root. The current V0.19.55 handtest and
# the last stable pre-mail V0.19.54 are published under isolated subpaths.
on:
  push:
    branches: [main]
    paths:
      - 'release/current.json'
      - 'release/v*/site/**'
      - 'scripts/refresh-update-manifest.js'
      - 'tests/**'
      - 'docs/KC-DP2-ENGINEERING-RULES.md'
      - '.github/workflows/deploy-kc-dp2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod
      - name: Checkout stable pre-mail V0.19.54
        uses: actions/checkout@v6
        with:
          ref: restore/v0.19.54-stable
          path: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve canonical current release
        id: release
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release/current.json').version")"
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          test "$RELEASE_PATH" = "release/v${VERSION}/site"
          test -f "$RELEASE_PATH/index.html"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"
      - name: Refresh deterministic release manifest
        working-directory: prod
        run: node scripts/refresh-update-manifest.js
      - name: Verify canonical current release
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          node tests/tuev-studio-current.js
          node tests/ux-current-gate.js
          node tests/diagnostics-v01944-gate.js
          node release/v0.19.51/tests/diagnostics-manager-center-contract.mjs
          node tests/push-center-v01943-gate.js
          node tests/pilot-v01948-gate.js
          node tests/pilot-mobile-secure-gate.js
          node tests/installation-history-gate.js
          node tests/admin-push-settings-gate.js
          ROOT="${{ steps.release.outputs.path }}"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$ROOT" -type f -name '*.js' -print0)
      - name: Verify current V0.19.55 handtest candidate
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          HANDTEST="release/v0.19.55/site/handtest-v01955"
          test -f "$HANDTEST/index.html"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$HANDTEST" -type f -name '*.js' -print0)
      - name: Verify stable V0.19.54 candidate
        working-directory: stable
        shell: bash
        run: |
          set -euo pipefail
          STABLE="release/v0.19.54/site"
          test -f "$STABLE/index.html"
          grep -q "KC DP2 V0.19.54" "$STABLE/index.html"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "$STABLE" -type f -name '*.js' -print0)
      - name: Build combined Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -a "prod/${{ steps.release.outputs.path }}/." dist/

          rm -rf dist/handtest-v01955
          mkdir -p dist/handtest-v01955
          cp -a prod/release/v0.19.55/site/handtest-v01955/. dist/handtest-v01955/

          rm -rf dist/stable-v01954
          mkdir -p dist/stable-v01954
          cp -a stable/release/v0.19.54/site/. dist/stable-v01954/

          printf '%s\n' \
            "production=${{ steps.release.outputs.version }}" \
            "handtest=0.19.55-main" \
            "stable=0.19.54-pre-mail" > dist/HANDTEST_BUILD.txt
          test -f dist/index.html
          test -f dist/handtest-v01955/index.html
          test -f dist/stable-v01954/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
