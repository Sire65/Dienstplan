name: KC DP2 Verified Web Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify canonical V0.19.44 release
        shell: bash
        run: |
          set -euo pipefail
          node tests/release-v01944-gate.js
          node tests/diagnostics-v01944-gate.js
          node tests/push-center-v01943-gate.js
          node --check release/v0.19.44/site/service-worker.js
          node --check release/v0.19.44/site/src/adapters/push.js
          node --check release/v0.19.44/site/src/core/update-manager.js
          node --check release/v0.19.44/site/src/core/table-core-adapter.js
          node --check release/v0.19.44/site/src/adapters/diagnostics.js
          node --check release/v0.19.44/site/src/ui/diagnostics-center.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/v0.19.44/site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
