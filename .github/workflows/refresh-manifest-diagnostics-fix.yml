name: KC DP2 Diagnostics Fix Manifest Refresh

on:
  push:
    branches:
      - fix/diagnostics-history-v01951
    paths:
      - 'release/v0.19.51/site/**'

permissions:
  contents: write

concurrency:
  group: kc-dp2-diagnostics-manifest-fix
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/diagnostics-history-v01951
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh update manifest
        run: node scripts/refresh-update-manifest.js
      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/v0.19.51/site/update-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current."
            exit 0
          fi
          git commit -m "Refresh DP2 update manifest for diagnostics fix"
          git push origin HEAD:fix/diagnostics-history-v01951
