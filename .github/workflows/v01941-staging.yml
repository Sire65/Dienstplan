name: KC DP2 V0.19.41 Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dedicated-supabase-v01941
    paths:
      - 'release/v0.19.41/**'
      - 'tests/dedicated-supabase-e2e.js'
      - '.github/workflows/v01941-staging.yml'

permissions:
  contents: read

concurrency:
  group: kc-dp2-v01941-staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Static architecture and syntax checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('release/v0.19.41/site')
          integ=(root/'src/core/integrations.js').read_text(encoding='utf-8')
          push=(root/'src/adapters/push.js').read_text(encoding='utf-8')
          upd=(root/'src/core/update-manager.js').read_text(encoding='utf-8')
          assert "DEDICATED_REF='ptblnpiroqftcvlsrhac'" in integ
          assert "profile:'KC_DP_DEDICATED_PROJECT'" in integ
          assert "version:'0.19.41'" in integ
          assert "LEGACY_REFS=['iddudrxuihdodnvejxcp'" in integ
          assert "version:'0.19.41'" in push
          assert 'reconcileExisting' in push
          assert 'sameApplicationServerKey' in push
          assert "service-worker.js?v=0.19.41" in push
          start=push.index('async function reconcileExisting')
          end=push.index('function hasSubscription',start)
          assert 'Notification.requestPermission' not in push[start:end], 'Auto-Reconcile darf keine Berechtigungsabfrage auslösen'
          sub_start=push.index('async function subscribe')
          sub_end=push.index('async function reconcileExisting',sub_start)
          assert 'Notification.requestPermission' in push[sub_start:sub_end], 'Manuelle Aktivierung muss Berechtigung weiterhin anfordern'
          assert "CURRENT_RELEASE='0.19.41'" in upd
          assert "version:'0.19.41'" in upd
          assert 'service-worker.js?v=0.19.41-engine' in upd
          print('V0.19.41 Architektur, Push-Sicherheit und Releasekennung: PASS')
          PY
          node --check release/v0.19.41/site/src/core/integrations.js
          node --check release/v0.19.41/site/src/adapters/push.js
          node --check release/v0.19.41/site/src/core/update-manager.js
          node --check tests/dedicated-supabase-e2e.js

      - name: Verify V0.19.41 manifest and byte baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          base=Path('release/v0.19.40/site')
          root=Path('release/v0.19.41/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          expected={
            'src/core/integrations.js': (2653,'88f207434220527578faa372afffe1a3e28de2bcc1e09126b166b066e89f196b'),
            'src/adapters/push.js': (9385,'54f4bd65421bc373bc2276e80300529262229c6cde97f921a040090398143633'),
            'src/core/update-manager.js': (12270,'c20344b845bd768fa948cc5f4b042211b91f9e2a10dccf050efd5dd35383ea4f'),
          }
          assert manifest['schema']=='KC_DP_UPDATE_MANIFEST_V1'
          assert manifest['app']=='KC DP2'
          assert manifest['version']=='0.19.41'
          assert manifest['cacheName']=='kc-dp-release-0.19.41'
          assert manifest['totalRuntimeBytes']==24308
          files={x['path']:x for x in manifest['files'] if x.get('runtime') is not False}
          assert set(files)==set(expected), f'Unerwartete Manifest-Dateien: {sorted(files)}'

          actuals={}
          for rel in expected:
            data=(root/rel).read_bytes()
            actuals[rel]=(len(data),hashlib.sha256(data).hexdigest())
            print(f'KC_META {rel} bytes={len(data)} sha256={actuals[rel][1]}')
          errors=[]
          for rel,(size,sha) in expected.items():
            actual_size,actual_sha=actuals[rel]
            if actual_size!=size: errors.append(f'{rel}: bytes {actual_size} != {size}')
            if actual_sha!=sha: errors.append(f'{rel}: SHA {actual_sha} != {sha}')
            if files[rel]['bytes']!=size: errors.append(f'{rel}: Manifest bytes {files[rel]["bytes"]} != {size}')
            if files[rel]['sha256']!=sha: errors.append(f'{rel}: Manifest SHA {files[rel]["sha256"]} != {sha}')
            if files[rel]['installPath']!=rel: errors.append(f'{rel}: installPath falsch')
          if errors: raise AssertionError('\n'.join(errors))

          base_files={p.relative_to(base).as_posix() for p in base.rglob('*') if p.is_file()}
          new_files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert base_files==new_files, 'V0.19.41 darf keine unerwarteten Site-Dateien hinzufügen/entfernen'
          allowed=set(expected)|{'update-manifest.json'}
          changed=[]
          for rel in sorted(base_files):
            if (base/rel).read_bytes()!=(root/rel).read_bytes(): changed.append(rel)
          assert set(changed)==allowed, f'Unerwartete Abweichungen zu V0.19.40: {changed}'
          print('V0.19.41 Manifest, Hashes und Byte-Baseline: PASS')
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated V0.19.41 server
        shell: bash
        run: |
          cd release/v0.19.41/site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kcdp-v01941.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kcdp-v01941.log
          exit 1

      - name: Dedicated Supabase browser regression
        run: node tests/dedicated-supabase-e2e.js

      - name: Inherited smartphone regression
        run: node tests/mobile-smoke.js

      - name: Inherited Wunsch Soll Ist regression
        run: node tests/workflow-e2e.js

      - name: Inherited documents regression
        run: node tests/documents-e2e.js

      - name: Inherited photo pipeline regression
        run: node tests/photo-pipeline-e2e.js

      - name: Inherited roles regression
        run: node tests/roles-e2e.js

      - name: Server log on failure
        if: failure()
        run: cat /tmp/kcdp-v01941.log || true
