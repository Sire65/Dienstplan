name: KC DP2 V0.19.39 Integrity Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print V0.19.39 runtime integrity
        run: |
          for f in \
            release/v0.19.39/site/src/ui/device-ux.js \
            release/v0.19.39/site/src/ui/start-choice.css \
            release/v0.19.39/site/src/ui/start-choice.js \
            release/v0.19.39/site/src/core/update-manager.js
          do
            printf 'KC_HASH %s bytes=' "$f"
            wc -c < "$f" | tr -d '\n'
            printf ' sha256='
            sha256sum "$f" | awk '{print $1}'
          done
