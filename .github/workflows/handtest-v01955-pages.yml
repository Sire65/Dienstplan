name: KC DP2 V0.19.55 Isolated Handtest

on:
  push:
    branches: [repair/current-by-v01954]
    paths:
      - '.github/workflows/handtest-v01955-pages.yml'
      - 'release/v0.19.55/site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-dp2-pages-handtest
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod

      - name: Checkout repaired handtest branch
        uses: actions/checkout@v6
        with:
          ref: repair/current-by-v01954
          path: repair

      - name: Build combined Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PROD_VERSION="$(node -p "require('./prod/release/current.json').version")"
          PROD_PATH="$(node -p "require('./prod/release/current.json').releasePath")"
          test -d "prod/$PROD_PATH"
          test -f repair/release/v0.19.55/site/index.html
          cp -a "prod/$PROD_PATH/." dist/
          mkdir -p dist/handtest-v01955
          cp -a repair/release/v0.19.55/site/. dist/handtest-v01955/
          printf '%s\n' "production=$PROD_VERSION" "handtest=0.19.55" > dist/HANDTEST_BUILD.txt
          test -f dist/index.html
          test -f dist/handtest-v01955/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
