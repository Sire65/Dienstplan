name: KC Supabase Keepalive

on:
  schedule:
    # Three lightweight API requests per day. GitHub cron uses UTC.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase-keepalive.yml'

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send lightweight Supabase API activity
        shell: bash
        env:
          KC_CORE_URL: https://ptblnpiroqftcvlsrhac.supabase.co
          KC_CORE_KEY: sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24
          FUTURA_URL: https://iddudrxuihdodnvejxcp.supabase.co
          FUTURA_KEY: sb_publishable_DWLycZijZEBvakXVncI5IQ_38LZCQxW
        run: |
          set -euo pipefail

          ping_supabase() {
            local name="$1"
            local url="$2"
            local key="$3"
            local body status
            body="$(mktemp)"

            status="$(curl -sS \
              --retry 2 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 30 \
              -o "$body" \
              -w '%{http_code}' \
              -H "apikey: $key" \
              -H 'Accept: application/openapi+json' \
              "$url/rest/v1/")"

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "::error::$name Supabase keepalive failed with HTTP $status"
              cat "$body"
              rm -f "$body"
              exit 1
            fi

            echo "$name Supabase keepalive OK (HTTP $status)"
            rm -f "$body"
          }

          ping_supabase "KC-DP2" "$KC_CORE_URL" "$KC_CORE_KEY"
          ping_supabase "Future Academy" "$FUTURA_URL" "$FUTURA_KEY"
