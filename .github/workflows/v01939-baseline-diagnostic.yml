name: KC DP2 V0.19.39 Baseline Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Diagnose baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, traceback
          out=[]
          def check(name, fn):
              try:
                  v=fn()
                  out.append(f'PASS|{name}|{v if v is not None else "OK"}')
              except Exception as e:
                  out.append(f'FAIL|{name}|{type(e).__name__}: {e}')
          old=Path('release/v0.19.38/site')
          root=Path('release/v0.19.39/site')
          manifest=json.loads((root/'update-manifest.json').read_text(encoding='utf-8'))
          current=json.loads(Path('release/current.json').read_text(encoding='utf-8'))
          changed={item['path'] for item in manifest['files']}
          expected={'src/ui/device-ux.js','src/ui/start-choice.css','src/ui/start-choice.js','src/core/update-manager.js'}
          check('manifest-version', lambda: manifest['version'] if manifest['version']=='0.19.39' else (_ for _ in ()).throw(AssertionError(manifest['version'])))
          check('cache-name', lambda: manifest['cacheName'] if manifest['cacheName']=='kc-dp-release-0.19.39' else (_ for _ in ()).throw(AssertionError(manifest['cacheName'])))
          check('total-bytes', lambda: (manifest['totalRuntimeBytes'],sum(int(x['bytes']) for x in manifest['files'])) if manifest['totalRuntimeBytes']==sum(int(x['bytes']) for x in manifest['files']) else (_ for _ in ()).throw(AssertionError((manifest['totalRuntimeBytes'],sum(int(x['bytes']) for x in manifest['files'])))))
          check('changed-set', lambda: sorted(changed) if changed==expected else (_ for _ in ()).throw(AssertionError(f'actual={sorted(changed)} expected={sorted(expected)}')))
          check('current-version', lambda: current if current['version']=='0.19.39' and current['baseVersion']=='0.19.38' and current['previousVersion']=='0.19.38' and current['releasePath']=='release/v0.19.39/site' else (_ for _ in ()).throw(AssertionError(current)))
          def integrity():
              rows=[]
              for item in manifest['files']:
                  target=root/item['path'];data=target.read_bytes();h=hashlib.sha256(data).hexdigest()
                  if len(data)!=item['bytes'] or h!=item['sha256']:
                      raise AssertionError(f'{item["path"]}: actual bytes={len(data)} sha={h}; manifest bytes={item["bytes"]} sha={item["sha256"]}')
                  rows.append(f'{item["path"]}:{len(data)}:{h}')
              return '; '.join(rows)
          check('manifest-file-integrity', integrity)
          def bytebaseline():
              diffs=[];missing=[];count=0
              for src in old.rglob('*'):
                  if not src.is_file(): continue
                  rel=src.relative_to(old).as_posix()
                  if rel in changed or rel=='update-manifest.json': continue
                  dst=root/rel;count+=1
                  if not dst.is_file(): missing.append(rel);continue
                  if src.read_bytes()!=dst.read_bytes():
                      diffs.append(f'{rel}: old={hashlib.sha256(src.read_bytes()).hexdigest()} new={hashlib.sha256(dst.read_bytes()).hexdigest()}')
              if missing or diffs: raise AssertionError(f'missing={missing}; diffs={diffs}')
              return f'{count} unveränderte Dateien bytegleich'
          check('v01938-byte-baseline', bytebaseline)
          def extras():
              old_files={p.relative_to(old).as_posix() for p in old.rglob('*') if p.is_file()}
              new_files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
              extra=sorted(new_files-old_files);removed=sorted(old_files-new_files)
              if set(extra)!={'src/ui/start-choice.css','src/ui/start-choice.js'}: raise AssertionError(f'extra={extra}; removed={removed}')
              return f'extra={extra}; removed={removed}'
          check('file-set', extras)
          check('probe-file-absent', lambda: 'absent' if not Path('release/v0.19.39/INTEGRITY_PROBE.txt').exists() else (_ for _ in ()).throw(AssertionError('exists')))
          check('probe-workflow-absent', lambda: 'absent' if not Path('.github/workflows/v01939-integrity-probe.yml').exists() else (_ for _ in ()).throw(AssertionError('exists')))
          Path('release/v0.19.39/BASELINE_DIAGNOSTIC.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
          git config user.name "KC DP2 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add release/v0.19.39/BASELINE_DIAGNOSTIC.txt
          if ! git diff --cached --quiet; then
            git commit -m "KC DP2 V0.19.39 – Baseline-Diagnose festhalten"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
