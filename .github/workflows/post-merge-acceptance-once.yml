name: KC DP2 Post-Merge Acceptance Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-merge-acceptance-once.yml']

permissions:
  contents: read
  issues: write

concurrency:
  group: kc-dp2-post-merge-acceptance-once
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Resolve current release and start local server
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PATH="$(node -p "require('./release/current.json').releasePath")"
          VERSION="$(node -p "require('./release/current.json').version")"
          test "$VERSION" = "0.19.51"
          test "$RELEASE_PATH" = "release/v0.19.51/site"
          cd "$RELEASE_PATH"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kcdp-postmerge-http.log 2>&1 &
          echo $! >/tmp/kcdp-postmerge-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/kcdp-postmerge-http.log
          exit 1
      - name: Main TÜV, manifest, security architecture and readiness gates
        run: |
          node tests/tuev-studio-current.js
          node tests/ux-current-gate.js
          node tests/diagnostics-v01944-gate.js
          node tests/diagnostics-history-v01951-gate.js
          node tests/supabase-connection-monitor-v01951-gate.js
          node tests/excel-migration-v01951-gate.js
          node release/v0.19.51/tests/diagnostics-manager-center-contract.mjs
          node tests/push-center-v01943-gate.js
          node tests/pilot-v01948-gate.js
          node tests/roles-e2e.js
      - name: Main practical E2E regression
        run: |
          node tests/mobile-smoke.js
          node tests/workflow-e2e.js
          node tests/documents-e2e.js
          node tests/photo-pipeline-e2e.js
      - name: Verify live GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sire65.github.io/Dienstplan'
          ok=0
          for i in {1..24}; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$BASE/index.html?acceptance=$GITHUB_SHA-$i" -o /tmp/live-index.html \
              && grep -q 'KC DP2 V0.19.51' /tmp/live-index.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "$BASE/src/ui/diagnostics-center.js?acceptance=$GITHUB_SHA-$i" -o /tmp/live-diag.js \
              && grep -q '0.19.51-monitor3' /tmp/live-diag.js \
              && grep -q '0.19.51-history4' /tmp/live-diag.js \
              && grep -q 'excel-migration-center.js?v=0.19.51-migration1' /tmp/live-diag.js \
              && curl -fsSL -H 'Cache-Control: no-cache' "$BASE/update-manifest.json?acceptance=$GITHUB_SHA-$i" -o /tmp/live-manifest.json \
              && grep -q '"version": "0.19.51"' /tmp/live-manifest.json \
              && grep -q 'src/ui/excel-migration-center.js' /tmp/live-manifest.json; then
                ok=1; break
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Report post-merge acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE='KC DP2 V0.19.51 Main Live Acceptance GREEN'
            BODY="Ergebnis: GREEN\n\nMain-Commit: $GITHUB_SHA\nRun: $GITHUB_RUN_ID\n\nBestanden: Main TÜV/Manifest/SHA-256, Security-/Architekturregeln, Supabase Heartbeat/Reconnect, Diagnose-Historie, Alt-Excel-Migration, Rollen, Mobile, Wunsch/Soll/Ist, Dokumente, Planfoto und GitHub-Pages-Liveprüfung.\n\nExterne PR-Prüfung vor Merge: CodeQL + Semgrep GREEN."
          else
            TITLE='KC DP2 V0.19.51 Main Live Acceptance RED'
            BODY="Ergebnis: RED\n\nMain-Commit: $GITHUB_SHA\nRun: $GITHUB_RUN_ID\n\nMindestens ein Main-/Live-Abnahmeschritt ist fehlgeschlagen. Der Workflow-Run muss vor einer Echtbetriebsfreigabe ausgewertet werden."
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="$BODY" >/dev/null
